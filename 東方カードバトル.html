              return `<div class="character-select-card builder-card choice-option" data-choice-index="${i}" style="--type-color:${TYPE_COLOR[c.type]||'#a8813f'}">
                <div class="character-select-top"><div class="character-select-name">${label}</div></div>
                <div class="character-select-desc-row">${sub}</div>
              </div>`;
            }
            const cs = c.cardStage || 'easy';
            const weak = c.weakness.length ? c.weakness.join('・') : 'なし';
            const movesHtml = c.moves.map(m=>{
              const costOrbs = m.cost === 0
                ? '<span class="orb empty"></span>'
                : Array.from({length:m.cost},()=>'<span class="orb"></span>').join('');
              const detail = `${m.element}属性${effectLabel(m.effects)}`;
              return `<div class="character-select-move">
                <span class="character-select-cost">${costOrbs}</span>
                <span class="character-select-move-name">${m.name}<span class="character-select-move-desc">${detail}</span></span>
                <span class="character-select-dmg">${m.dmg}</span>
              </div>`;
            }).join('');
            return `<div class="character-select-card builder-card choice-option" data-choice-index="${i}" style="--type-color:${TYPE_COLOR[c.type]||'#888'}">
              <div class="character-select-top">
                <div class="character-select-name">${c.name}${stageBadge({stage:cs})}</div>
                <div class="character-select-type">${c.type}</div>
              </div>
              <div class="character-select-hp">HP ${c.hp}</div>
              <div class="character-select-weak">弱点: ${weak}</div>
              ${c.passive ? `<div class="character-select-passive">✨ ${passiveLabel(c)}</div>` : ''}
              <div class="character-select-moves builder-card-body">${movesHtml}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  const evolveModalHtml = evolvePending ? (()=>{
    const player = state.players[state.turn];
    return `
    <div class="builder-modal card-choice-modal">
      <div class="builder-modal-box card-choice-box">
        <div class="builder-modal-header"><h3>「${evolvePending.card.name}」で進化させるキャラを選んでください</h3></div>
        <div class="character-card-grid">
          ${evolvePending.options.map((opt,i)=>{
            const inst = opt.isMain ? player.main : player.bench[opt.benchIdx];
            const label = opt.isMain ? `メイン：${inst.card.name}` : `ベンチ：${inst.card.name}`;
            const maxHp = getMaxHp(inst);
            return `<div class="character-select-card builder-card choice-option" data-evolve-choice-index="${i}" style="--type-color:${TYPE_COLOR[inst.card.type]||'#a8813f'}">
              <div class="character-select-top"><div class="character-select-name">${label}</div></div>
              <div class="character-select-desc-row">HP ${Math.max(0,inst.hp)}/${maxHp}・${STAGE_LABEL[inst.stage||'easy']}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  })() : '';

  app.innerHTML = `
    <div class="table ${state.logVisible === false ? 'log-hidden' : ''}">
      <div class="board">
        ${renderOpponentHandBacks(otherPlayer, selfIdx)}
        <div class="side">
          <div class="deck-info">${otherPlayer.name}${state.mode==='online'?' <span class="online-badge">相手</span>':''}<br>山札 ${otherPlayer.deck.length}枚 ／ 手札 ${otherPlayer.hand.length}枚<div class="ko-count">撃破: ${otherPlayer.knockouts||0}/5</div></div>
          <div class="board-row">
            ${renderMainSlot(otherPlayer, selfPlayer, false, false, false, enemyTargetMode && !!otherPlayer.main)}
            <div class="bench-row">${benchOtherHtml}</div>
          </div>
        </div>
        <div class="barrier"><span>結界</span></div>
        <div class="side">
          <div class="deck-info">${selfPlayer.name}${state.mode==='online'?' <span class="online-badge">あなた</span>':''}<br>山札 ${selfPlayer.deck.length}枚<div class="ko-count">撃破: ${selfPlayer.knockouts||0}/5</div></div>
          <div class="board-row">
            ${renderMainSlot(selfPlayer, otherPlayer, true, attackClickable, ownTargetMode, false)}
            <div class="bench-row">${benchSelfHtml}</div>
          </div>
        </div>

        <div class="hand-row">${handHtml}</div>

        <div class="controls">
          <button id="endTurnBtn" ${(state.gameOver||state.disconnected||!humanActive||forcedPending||promoPending||gapPending||choicePending||evolvePending||moveTargetingBench||benchBuffPending)?'disabled':''}>ターン終了</button>
          <button id="toggleLogBtn" class="manual-btn">${state.logVisible === false ? 'ログを表示' : 'ログを隠す'}</button>
          <button id="openManualBtn" class="manual-btn">説明書</button>
          <button id="resignBtn" class="resign" ${(state.gameOver||state.disconnected)?'disabled':''}>${state.resignConfirmPending ? 'もう一度押すと投了' : '投了'}</button>
        </div>

        ${pendingMessage}

        ${state.disconnected
          ? `<div class="online-disconnect-banner">対戦相手との接続が切れました。ゲームを続行できません。</div>`
          : (!humanActive && !forcedSwapSelf && !promoSelf)
            ? (state.mode === 'online'
                ? `<div class="thinking spinner-dots">相手の番です</div>`
                : `<div class="thinking">CPU思考中…</div>`)
            : `<div class="hint">現在のターン：${state.players[state.turn].name}${`（エネルギー${state.energyAttachedThisTurn}/2枚）`}${state.itemAttachedThisTurn?'（持ち物済み）':''}${state.specialUsedThisTurn?'（特殊カード済み）':''}${state.retreatUsedThisTurn?'（交代済み）':''}${attackClickable?'　／　わざをタップで攻撃、ベンチをタップで交代（1ターン1回）、場に同じキャラがいる状態でその手札をタップすると進化':''}</div>`}
      </div>

      ${state.logVisible === false ? '' : `
      <div class="log-panel" id="log">
        <div class="log-title">バトルログ</div>
        ${state.log.slice(-40).map(l=>`<div>${l}</div>`).join('')}
      </div>`}
    </div>
    ${choiceModalHtml}
    ${evolveModalHtml}
    ${renderManualModal()}
  `;

  const logEl = document.getElementById('log');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;

  if(state.gameOver){ renderResultModal(); } else { hideResultModal(); }

  broadcastStateIfHost();
}

function broadcastStateIfHost(){
  if(state && state.mode === 'online' && netRole === 'host' && conn && conn.open){
    try{
      conn.send({ t:'state', state: JSON.parse(JSON.stringify(state)) });
    }catch(e){ console.error('state broadcast failed', e); }
  }
}

function renderResultModal(){
  const modal = document.getElementById('resultModal');
  if(!modal) return;
  const isCpu = state.mode === 'cpu';
  let bannerText, bannerClass;
  if(isCpu){
    bannerText = state.winner === 0 ? 'WIN!!' : 'LOSE...';
    bannerClass = state.winner === 0 ? 'win' : 'lose';
  } else {
    bannerText = `${state.players[state.winner].name} WIN!!`;
    bannerClass = 'win';
  }
  const isOnline = state.mode === 'online';
  modal.innerHTML = `
    <div class="result-box ${bannerClass}">
      <div class="result-banner">${bannerText}</div>
      <div class="result-sub">${state.players[state.winner].name} の勝利！</div>
      <div class="controls">
        ${isOnline ? '' : '<button id="restartBtn">もう一度遊ぶ（同じデッキ）</button>'}
        <button id="backToMenuBtn" class="resign">${isOnline ? 'メニューに戻る' : 'デッキを組み直す'}</button>
      </div>
    </div>`;
  modal.style.display = 'flex';
}
function hideResultModal(){
  const modal = document.getElementById('resultModal');
  if(modal) modal.style.display = 'none';
}

/* =========================================================
   イベント
========================================================= */
const appEl = document.getElementById('app');

function isGuestOnline(){
  return !!(state && state.mode === 'online' && netRole === 'guest');
}
function sendAction(fnName, args){
  if(conn && conn.open){ conn.send({ t:'action', fn: fnName, args: args }); }
}
function act(fnName, args){
  if(isGuestOnline()){
    sendAction(fnName, args || []);
  } else {
    const f = REMOTE_ACTIONS[fnName];
    if(f) f.apply(null, args || []);
  }
}
function chooseMoveRequiringTarget(mi){
  const curPlayer = state.players[state.turn];
  const mv = curPlayer.main && curPlayer.main.card.moves[mi];
  if(!mv) return;
  state.pendingMoveIndex = mi;
  log(`「${mv.name}」を選択した。相手のベンチの対象をタップしてください。`);
  render();
}
function useMoveWithBenchTarget(mi, benchIdx){
  state.pendingMoveIndex = null;
  onUseMove(mi, benchIdx);
}
// オンライン対戦でゲスト側から呼び出せる操作のホワイトリスト。
// ホスト側でこれらを実行し、結果を state ごとゲストへ送り返す。
const REMOTE_ACTIONS = {
  onHandCardClick, onUseMove, onTargetClick, onEnemyTargetClick, retreatSwap, endTurn,
  onResignClick, resolveForcedSwap, resolvePromotion, resolveGapSwap, resolveBenchBuffChoice,
  resolveCardChoice, resolveEvolveChoice, chooseMoveRequiringTarget, useMoveWithBenchTarget,
};

appEl.addEventListener('click', (e)=>{
  const t0 = e.target;
  if(t0.id === 'toggleLogBtn' && state){ state.logVisible = (state.logVisible === false) ? true : false; render(); return; }
  if(t0.id === 'openManualBtn'){ toggleManualModal(true); return; }
  if(t0.matches('[data-close-manual]')){ toggleManualModal(false); return; }
  if(t0.matches('[data-close-manual-backdrop]')){ toggleManualModal(false); return; }
  if(t0.id === 'openDiagnosisBtn' && builder){ builder.diagnosisOpen = true; renderBuilder(); return; }
  if(t0.matches('[data-close-diagnosis]') && builder){ builder.diagnosisOpen = false; renderBuilder(); return; }
  if(t0.matches('[data-close-diagnosis-backdrop]') && builder){ builder.diagnosisOpen = false; renderBuilder(); return; }

  if(t0.id === 'openDeckSlotsBtn'){ toggleDeckSlotsModal(true); return; }
  if(t0.matches('[data-close-slots]')){ toggleDeckSlotsModal(false); return; }
  if(t0.matches('[data-close-slots-backdrop]')){ toggleDeckSlotsModal(false); return; }
  if(t0.matches('[data-save-slot]') && builder){
    const slotIndex = parseInt(t0.dataset.saveSlot,10);
    saveDeckToSlot(slotIndex, builder.selections, `スロット${slotIndex+1}`);
    renderBuilder();
    return;
  }
  if(t0.matches('[data-load-slot]') && builder){
    const slotIndex = parseInt(t0.dataset.loadSlot,10);
    const loaded = loadDeckFromSlot(slotIndex);
    if(loaded){
      builder.selections = loaded;
      builder.slotModalOpen = false;
      renderBuilder();
    }
    return;
  }
  if(t0.matches('[data-delete-slot]')){
    const slotIndex = parseInt(t0.dataset.deleteSlot,10);
    clearDeckSlot(slotIndex);
    renderBuilder();
    return;
  }

  if(builder){
    const t = e.target;

    if(t.matches('[data-open-character-filter]')){
      builder.filterOpen = true;
      renderBuilder();
      return;
    }
    if(t.matches('[data-close-filter]')){
      builder.filterOpen = false;
      renderBuilder();
      return;
    }
    if(t.matches('[data-clear-character-filter]')){
      builder.charFilter = { types:[], elements:[], weaknesses:[] };
      builder.filterOpen = false;
      renderBuilder();
      return;
    }
    if(t.matches('[data-apply-character-filter]')){
      builder.filterOpen = false;
      renderBuilder();
      return;
    }
    if(t.matches('input[data-filter-key]')){
      const key = t.dataset.filterKey;
      const value = t.dataset.filterValue;
      const list = builder.charFilter[key];
      if(t.checked){
        if(!list.includes(value)) list.push(value);
      } else {
        builder.charFilter[key] = list.filter(v=>v !== value);
      }
      // 絞り込みモーダル内では即時反映。ただしモーダルは閉じない。
      renderBuilder();
      return;
    }
    if(t.dataset.char){ adjustCharStage(t.dataset.char, t.dataset.stage, parseInt(t.dataset.delta,10)); return; }
    if(t.dataset.energyDelta){ adjustEnergy(parseInt(t.dataset.energyDelta,10)); return; }
    if(t.dataset.retreatEnergyDelta){ adjustRetreatEnergy(parseInt(t.dataset.retreatEnergyDelta,10)); return; }
    if(t.dataset.item){ adjustItem(t.dataset.item, parseInt(t.dataset.delta,10)); return; }
    if(t.dataset.special){ adjustSpecial(t.dataset.special, parseInt(t.dataset.delta,10)); return; }
    if(t.dataset.support){ adjustSupport(t.dataset.support, parseInt(t.dataset.delta,10)); return; }
    if(t.id === 'autoFillBtn'){ autoFillBuilder(); return; }
    if(t.id === 'confirmDeckBtn'){ confirmBuilderDeck(); return; }
    if(t.id === 'backToMenuFromBuilder'){
      if(builder && builder.mode === 'online'){ cleanupPeer(); }
      showStartScreen();
      return;
    }
    return;
  }

  if(onlineUI){
    const t = e.target;
    if(t.id === 'onlineHostBtn'){ startHosting(); return; }
    if(t.id === 'onlineJoinBtn'){ startJoining(); return; }
    if(t.id === 'joinConnectBtn'){
      const inputEl = document.getElementById('joinCodeInput');
      connectToRoom(inputEl ? inputEl.value : '');
      return;
    }
    if(t.id === 'backToMenuFromOnline'){
      cleanupPeer();
      onlineUI = null;
      showStartScreen();
      return;
    }
    return;
  }

  if(!state){
    if(e.target.id === 'modeCpu'){ showDifficultyScreen(); return; }
    if(e.target.id === 'modeHotseat'){ beginDeckBuilding('hotseat'); return; }
    if(e.target.id === 'modeOnline'){ showOnlineMenu(); return; }
    if(e.target.id === 'modeSpectator'){ startSpectatorMode(); return; }
    if(e.target.matches('[data-ai-difficulty]')){ beginDeckBuilding('cpu', e.target.dataset.aiDifficulty); return; }
    if(e.target.id === 'backToMenuFromDifficulty'){ showStartScreen(); return; }
    return;
  }

  if(e.target.id === 'resignBtn'){ act('onResignClick', [getSelfIdx()]); return; }

  if(state.gameOver){
    if(e.target.id === 'restartBtn' && savedMode !== 'online'){
      initGame(savedMode, [shuffle(savedDecks[0].slice()), shuffle(savedDecks[1].slice())]);
    } else if(e.target.id === 'backToMenuBtn'){
      backToMenuAfterGame();
    }
    return;
  }

  if(state.disconnected) return;

  if(state.forcedSwapPending){
    const forcedEl = e.target.closest('[data-forced-swap-index]');
    if(forcedEl){ act('resolveForcedSwap', [parseInt(forcedEl.dataset.forcedSwapIndex,10)]); }
    return;
  }

  if(state.promotionPending){
    const promoEl = e.target.closest('[data-promotion-index]');
    if(promoEl){ act('resolvePromotion', [parseInt(promoEl.dataset.promotionIndex,10)]); }
    return;
  }

  if(state.gapSwapPending){
    const gapEl = e.target.closest('[data-gap-swap-index]');
    if(gapEl){ act('resolveGapSwap', [parseInt(gapEl.dataset.gapSwapIndex,10)]); }
    return;
  }

  if(state.benchBuffPending){
    const bbEl = e.target.closest('[data-benchbuff-index]');
    if(bbEl){ act('resolveBenchBuffChoice', [parseInt(bbEl.dataset.benchbuffIndex,10)]); }
    return;
  }

  if(state.cardChoicePending){
    const choiceEl = e.target.closest('[data-choice-index]');
    if(choiceEl){ act('resolveCardChoice', [parseInt(choiceEl.dataset.choiceIndex,10)]); }
    return;
  }

  if(state.evolveChoicePending){
    const evoEl = e.target.closest('[data-evolve-choice-index]');
    if(evoEl){ act('resolveEvolveChoice', [parseInt(evoEl.dataset.evolveChoiceIndex,10)]); }
    return;
  }

  if(!isHumanTurnNow()) return;

  if(state.pendingMoveIndex !== null){
    const enemyBenchEl = e.target.closest('[data-enemy-bench-index]');
    if(enemyBenchEl){
      const mi = state.pendingMoveIndex;
      const benchIdx = parseInt(enemyBenchEl.dataset.enemyBenchIndex,10);
      act('useMoveWithBenchTarget', [mi, benchIdx]);
    }
    return;
  }

  const handEl = e.target.closest('[data-hand-index]');
  if(handEl){ act('onHandCardClick', [parseInt(handEl.dataset.handIndex,10)]); return; }

  if(state.selectedHandIndex !== null){
    const enemyMainEl = e.target.closest('[data-enemy-main-target]');
    if(enemyMainEl){ act('onEnemyTargetClick', ['main']); return; }
    const enemyBenchEl = e.target.closest('[data-enemy-bench-index]');
    if(enemyBenchEl){ act('onEnemyTargetClick', ['bench'+enemyBenchEl.dataset.enemyBenchIndex]); return; }
    const mainEl = e.target.closest('[data-main-target]');
    if(mainEl){ act('onTargetClick', ['main']); return; }
    const benchEl2 = e.target.closest('[data-bench-index]');
    if(benchEl2){ act('onTargetClick', ['bench'+benchEl2.dataset.benchIndex]); return; }
    return;
  }

  const benchEl = e.target.closest('[data-bench-index]');
  if(benchEl){ act('retreatSwap', [parseInt(benchEl.dataset.benchIndex,10)]); return; }

  if(e.target.id === 'endTurnBtn'){ act('endTurn', []); return; }

  const moveEl = e.target.closest('[data-move-index]');
  if(moveEl){
    const mi = parseInt(moveEl.dataset.moveIndex,10);
    const curPlayer = state.players[state.turn];
    const mv = curPlayer.main && curPlayer.main.card.moves[mi];
    if(mv && mv.targetBench){
      act('chooseMoveRequiringTarget', [mi]);
    } else {
      act('onUseMove', [mi]);
    }
    return;
  }
});

document.getElementById('resultModal').addEventListener('click', (e)=>{
  if(e.target.id === 'restartBtn' && savedMode !== 'online'){
    initGame(savedMode, [shuffle(savedDecks[0].slice()), shuffle(savedDecks[1].slice())]);
  } else if(e.target.id === 'backToMenuBtn'){
    backToMenuAfterGame();
  }
});

function backToMenuAfterGame(){
  if(state && state.mode === 'online'){ cleanupPeer(); }
  showStartScreen();
}

let lastHoverKey = null;
document.addEventListener('mousemove', (e)=>{
  if(!state){ if(lastHoverKey!==null){ lastHoverKey=null; hideCardDetail(); } return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const benchEl = el ? el.closest('[data-detail-bench]') : null;
  const handEl = !benchEl && el ? el.closest('[data-detail-index]') : null;

  if(benchEl){
    const key = 'bench:'+benchEl.dataset.detailBench;
    if(key !== lastHoverKey){ lastHoverKey = key; showBenchDetail(benchEl.dataset.detailBench); }
  } else if(handEl){
    const key = 'hand:'+handEl.dataset.detailIndex;
    if(key !== lastHoverKey){ lastHoverKey = key; showCardDetail(parseInt(handEl.dataset.detailIndex,10)); }
  } else if(lastHoverKey !== null){
    lastHoverKey = null;
    hideCardDetail();
  }
});
document.addEventListener('mouseleave', ()=>{
  if(lastHoverKey !== null){ lastHoverKey = null; hideCardDetail(); }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'joinCodeInput'){
    connectToRoom(document.activeElement.value);
  }
});

(function(){
  let draft = null;
  try{
    draft = loadBuilderDraft();
    if(draft && !isValidBuilderDraft(draft)){
      clearBuilderDraft();
      draft = null;
    }
  }catch(e){
    clearBuilderDraft();
    draft = null;
  }
  try{
    if(draft){
      draft.selections = repairBuilderSelections(draft.selections);
      if(!draft.decks) draft.decks = [null,null];
      if(typeof draft.playerIdx !== 'number') draft.playerIdx = 0;
      if(typeof draft.filterOpen !== 'boolean') draft.filterOpen = false;
      if(!draft.charFilter) draft.charFilter = { types:[], elements:[], weaknesses:[] };
      builder = draft;
      if(builderTotal() > 0){
        // ある程度カードを選び終えている途中経過のみ自動的に再開する。
        renderBuilder();
      } else {
        // 何も選んでいない（初期状態のまま保存された）下書きは再開せず、通常のメニューを表示する。
        builder = null;
        clearBuilderDraft();
        showStartScreen();
      }
    } else {
      showStartScreen();
    }
  }catch(e){
    clearBuilderDraft();
    showStartScreen();
  }
})();
  </script>
</body>
</html>
