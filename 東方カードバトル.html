function applyStatus(instance, statusType, sourceIdx, amountOverride, turnsOverride){
  let type = statusType;
  if(type === 'random'){ type = Math.random() < 0.5 ? 'burn' : 'freeze'; }

  const owner = findInstanceOwner(instance);
  if(owner && owner.main !== instance && owner.bench.includes(instance)){
    // ベンチにいるキャラは状態異常を受け付けない（メインに戻らない限り無効）
    return;
  }

  const harmfulStatusTypes = ['burn','freeze','curse'];
  const targetPassive = instance.card.passive;
  if(targetPassive && targetPassive.type === 'statusImmune' && harmfulStatusTypes.includes(type)){
    log(`${lname(instance.card.name)}は状態異常を受け付けない！`);
    return;
  }
  if(targetPassive && targetPassive.type === 'statusImmuneType' && targetPassive.statusType === type){
    log(`${lname(instance.card.name)}は${type==='burn'?'やけど':'凍結'}状態にならない！`);
    return;
  }

  let amount, turns;
  if(type === 'burn'){ amount = amountOverride || 20; turns = turnsOverride || 1; }
  else if(type === 'regen'){ amount = amountOverride || 15; turns = turnsOverride || 1; }
  else if(type === 'freeze'){ turns = turnsOverride || 1; }
  else if(type === 'shield'){ amount = amountOverride || 20; turns = turnsOverride || 1; }
  else if(type === 'curse'){ amount = amountOverride || 40; turns = turnsOverride || 1; }
  instance.status = { type, amount, turnsLeft: turns, sourcePlayerIdx: sourceIdx };
  const labelMap = { burn:'やけど', freeze:'凍結', regen:'再生', shield:'結界', curse:'道連れの呪い' };
  log(`${lname(instance.card.name)}は${labelMap[type]}状態になった！`);
}

function checkDeathCurseRetaliation(instance, deceasedPlayerIdx){
  if(!instance.status || instance.status.type !== 'curse') return;
  const amount = instance.status.amount || 40;
  const attackerIdx = 1-deceasedPlayerIdx;
  const attacker = state.players[attackerIdx];
  if(!attacker.main) return;
  attacker.main.hp -= amount;
  log(`${lname(instance.card.name)}の道連れの呪いが発動！ ${lname(attacker.main.card.name)}に${ldmg(amount)}！`);
  if(attacker.main.hp <= 0){
    log(`${lname(attacker.main.card.name)}は倒れた…`);
    attacker.discard.push(attacker.main.card);
    attacker.main = null;
    const deceasedPlayer = state.players[deceasedPlayerIdx];
    deceasedPlayer.knockouts = (deceasedPlayer.knockouts||0) + 1;
    log(`（${lname(deceasedPlayer.name)}の撃破数: ${deceasedPlayer.knockouts}/5）`);
    if(deceasedPlayer.knockouts >= 5){ endGame(deceasedPlayerIdx); return; }
    const promoIdx = attacker.bench.findIndex(b=>b!==null);
    if(promoIdx >= 0){
      attacker.main = attacker.bench[promoIdx];
      attacker.bench[promoIdx] = null;
      log(`${lname(attacker.main.card.name)}がメインに繰り上がった！`);
    }
  }
}

function damageEnemyBench(opponent, attackerPlayer, amount, filterType, filterFn){
  opponent.bench.forEach((b,i)=>{
    if(!b) return;
    if(filterType && b.card.type !== filterType) return;
    if(filterFn && !filterFn(b)) return;
    if(b.item && b.item.effect.benchInvulnerable){
      log(`${lname(b.card.name)}（ベンチ）は結界に守られてダメージを受けなかった。`);
      return;
    }
    b.hp -= amount;
    log(`${lname(b.card.name)}（ベンチ）に${ldmg(amount)}！`);
    if(b.hp <= 0){
      log(`${lname(b.card.name)}は倒れた…`);
      opponent.discard.push(b.card);
      opponent.bench[i] = null;
      attackerPlayer.knockouts = (attackerPlayer.knockouts||0) + 1;
      log(`（${lname(attackerPlayer.name)}の撃破数: ${attackerPlayer.knockouts}/5）`);
    }
  });
}

function estimateEffectiveElement(mv, effects, targetInstance){
  let el = mv.element;
  const wmeEf = effects.find(ef=>ef.type === 'weaknessMatchElement');
  if(wmeEf && targetInstance){
    const elemWeak = (targetInstance.card.weakness||[]).filter(w=>ELEMENT_LIST.includes(w));
    el = elemWeak.length ? elemWeak[0] : '無';
  }
  const randEf = effects.find(ef=>ef.type === 'randomElement');
  if(randEf){
    const pool = randEf.pool && randEf.pool.length ? randEf.pool : [mv.element];
    el = pool[0];
  }
  return el;
}

function computeDamage(instance, opponentInstance, moveIndex, overrideElement, isMainTarget){
  if(isMainTarget === undefined) isMainTarget = true;
  const move = instance.card.moves[moveIndex];
  const element = overrideElement || move.element;
  const effects = move.effects || [];
  const atkBonus = (instance.item && instance.item.effect.atk) || 0;
  let passiveAtkBonus = 0;
  const attackerPassive = instance.card.passive;
  if(attackerPassive && attackerPassive.type === 'atkBonusIfAllyPresent'){
    const owner = findInstanceOwner(instance);
    if(owner && hasAllyOnField(owner, attackerPassive.allyId)) passiveAtkBonus = attackerPassive.amount;
  }

  const tags = [instance.card.type, element];
  effects.forEach(ef=>{ if(ef.type === 'addElement') tags.push(ef.element); });
  effects.forEach(ef=>{
    if(ef.type === 'becomeTypeIfWeak' && opponentInstance.card.weakness.includes(ef.targetSpecies)){
      tags[0] = ef.targetSpecies;
    }
  });

  // 基準ダメージ（弱点計算はこの時点の値をもとに行う）
  let dmg = move.dmg + atkBonus + passiveAtkBonus + stageIdx(instance)*5;

  let weaknessBonus = 0;
  if(isMainTarget){
    // 弱点によるダメージ上昇はメインへの攻撃のみで発生し、ベンチは対象外
    const ignoreWeak = effects.some(ef=>ef.type === 'ignoreWeakness');
    if(ignoreWeak || opponentInstance.weaknessNegatedTurns > 0){
      weaknessBonus = 0;
    } else if(opponentInstance.reverseWeaknessTurns > 0){
      // 弱点逆呪：無属性以外のわざはすべて弱点扱い（弱点1個分として扱う）
      weaknessBonus = (element !== '無') ? 30 : 0;
    } else {
      weaknessBonus = calcWeaknessBonus(opponentInstance.card.weakness, tags);
    }
    if(opponentInstance.item && opponentInstance.item.effect.negateWeakness) weaknessBonus = 0;
    dmg += weaknessBonus;
  }

  // 追加効果（bonusVsType・bonusIfStatusなど）によるダメージは基準ダメージ＋弱点分の後に加算する
  effects.forEach(ef=>{
    if(ef.type === 'bonusVsType' && opponentInstance.card.type === ef.targetType) dmg += ef.amount;
    if(ef.type === 'bonusIfStatus' && opponentInstance.status && opponentInstance.status.type === ef.statusType) dmg += ef.amount;
    if(ef.type === 'bonusIfFullHp' && opponentInstance.hp >= getMaxHp(opponentInstance)) dmg += ef.amount;
    if(ef.type === 'bonusIfSelfFullHp' && instance.hp >= getMaxHp(instance)) dmg += ef.amount;
    if(ef.type === 'flatBonusDamage') dmg += ef.amount;
    if(ef.type === 'bonusIfWeakness' && opponentInstance.card.weakness.includes(ef.targetWeakness)) dmg += ef.amount;
    if(ef.type === 'bonusIfOpponentHigherHp' && opponentInstance.hp > instance.hp) dmg += ef.amount;
    if(ef.type === 'bonusIfOpponentHpAtLeast' && opponentInstance.hp >= ef.threshold) dmg += ef.amount;
  });

  if(instance.status && instance.status.type === 'freeze'){ dmg = Math.round(dmg * 0.75); }
  const defenderPassive = opponentInstance.card.passive;
  if(defenderPassive && defenderPassive.type === 'damageReductionFraction'){
    dmg = Math.round(dmg * defenderPassive.fraction);
  }
  let reduced = 0;
  if(opponentInstance.status && opponentInstance.status.type === 'shield'){
    reduced = Math.min(dmg, opponentInstance.status.amount);
    dmg -= reduced;
  }
  const bonusFracPassive = instance.card.passive;
  if(bonusFracPassive && bonusFracPassive.type === 'chanceBonusDamageFraction' && Math.random() < bonusFracPassive.chance){
    dmg += Math.round(dmg * bonusFracPassive.fraction);
  }
  let halved = false;
  if(opponentInstance.halfDamageNext){
    dmg = Math.round(dmg / 2);
    halved = true;
  }
  return { dmg, weaknessBonus, move, reduced, halved };
}

function damageMainAndCheck(defender, defenderIdx, dmg, attacker, attackerIdx){
  if(!defender.main) return false;
  defender.main.hp -= dmg;
  if(defender.main.hp > 0) return false;
  log(`${lname(defender.main.card.name)}は倒れた…`);
  defender.discard.push(defender.main.card);
  const dyingInst = defender.main;
  defender.main = null;
  attacker.knockouts = (attacker.knockouts||0) + 1;
  log(`（${lname(attacker.name)}の撃破数: ${attacker.knockouts}/5）`);
  checkDeathCurseRetaliation(dyingInst, defenderIdx);
  if(attacker.knockouts >= 5){ endGame(attackerIdx); return true; }
  const hasBench = defender.bench.some(b=>b!==null);
  if(hasBench){
    const pending = triggerPromotion(defenderIdx, ()=>endTurn());
    return pending; // 保留中なら残りのヒットは打ち切り、resolvePromotionがendTurnを呼ぶ
  }
  // ベンチが空でも、5体撃破に達していなければ試合は続行する
  return false;
}
function damageBenchAndCheck(defender, benchIdx, dmg, attacker, attackerIdx){
  const inst = defender.bench[benchIdx];
  if(!inst) return false;
  inst.hp -= dmg;
  if(inst.hp > 0) return false;
  log(`${lname(inst.card.name)}は倒れた…`);
  defender.discard.push(inst.card);
  defender.bench[benchIdx] = null;
  attacker.knockouts = (attacker.knockouts||0) + 1;
  log(`（${lname(attacker.name)}の撃破数: ${attacker.knockouts}/5）`);
  checkDeathCurseRetaliation(inst, 1-attackerIdx);
  if(attacker.knockouts >= 5){ endGame(attackerIdx); return true; }
  return false;
}

function applyCounterDamage(defendingInstance, attackerPlayer, attackerPlayerIdx, defenderPlayer){
  if(!defendingInstance || !defendingInstance.item || !defendingInstance.item.effect.counterDamage) return false;
  if(!attackerPlayer.main) return false;
  const amt = defendingInstance.item.effect.counterDamage;
  attackerPlayer.main.hp -= amt;
  log(`${lname(defendingInstance.card.name)}の「${defendingInstance.item.name}」が反撃！ ${lname(attackerPlayer.main.card.name)}に${ldmg(amt)}！`);
  if(attackerPlayer.main.hp <= 0){
    return damageMainAndCheck(attackerPlayer, attackerPlayerIdx, 0, defenderPlayer, 1-attackerPlayerIdx);
  }
  return false;
}

function onUseMove(moveIndex, benchTargetIndex){
  const player = state.players[state.turn];
  const opponent = state.players[1-state.turn];
  if(!player.main) return;
  const move = player.main.card.moves[moveIndex];
  if(!move) return;
  if(move.cost > player.main.energy) return;
  if(move.targetBench && benchTargetIndex === undefined) return;

  const effects = move.effects || [];
  const multiHitEf = effects.find(ef=>ef.type === 'multiHitRandom');
  const benchMultiHitEf = effects.find(ef=>ef.type === 'multiHitBenchRandom');
  const fixedMultiHitEf = effects.find(ef=>ef.type === 'fixedMultiHitMain');

  if(multiHitEf){
    if(!opponent.main && !opponent.bench.some(b=>b)) return;
    player.main.energy -= move.cost;
    const costMsg = move.cost === 0 ? '消費なし' : `エネルギー${move.cost}枚消費`;
    log(`${lname(player.main.card.name)}の「${move.name}」（${move.element}属性・${costMsg}）！`);
    const perHit = multiHitEf.dmgPerHit + stageIdx(player.main) * (multiHitEf.scalePerStage||0);
    for(let h=0; h<multiHitEf.hits; h++){
      const pool = [];
      if(opponent.main) pool.push({ isMain:true });
      opponent.bench.forEach((b,i)=>{ if(b) pool.push({ isMain:false, idx:i }); });
      if(pool.length === 0) break;
      const pick = pool[Math.floor(Math.random()*pool.length)];
      const dmg = perHit;
      const targetInst = pick.isMain ? opponent.main : opponent.bench[pick.idx];
      log(`${lname(targetInst.card.name)}に${ldmg(dmg)}！`);
      const ended = pick.isMain
        ? damageMainAndCheck(opponent, 1-state.turn, dmg, player, state.turn)
        : damageBenchAndCheck(opponent, pick.idx, dmg, player, state.turn);
      if(ended) return;
      if(applyCounterDamage(targetInst, player, state.turn, opponent)) return;
    }
    endTurn();
    return;
  }

  if(benchMultiHitEf){
    if(!opponent.bench.some(b=>b)) return;
    player.main.energy -= move.cost;
    const costMsg = move.cost === 0 ? '消費なし' : `エネルギー${move.cost}枚消費`;
    log(`${lname(player.main.card.name)}の「${move.name}」（${move.element}属性・${costMsg}）！`);
    const perHitB = benchMultiHitEf.dmgPerHit + stageIdx(player.main) * (benchMultiHitEf.scalePerStage||0);
    for(let h=0; h<benchMultiHitEf.hits; h++){
      const idxs = opponent.bench.map((b,i)=>b?i:null).filter(i=>i!==null);
      if(idxs.length === 0) break;
      const pick = idxs[Math.floor(Math.random()*idxs.length)];
      const dmg = perHitB;
      const targetInst = opponent.bench[pick];
      log(`${lname(targetInst.card.name)}に${ldmg(dmg)}！`);
      const ended = damageBenchAndCheck(opponent, pick, dmg, player, state.turn);
      if(ended) return;
      if(applyCounterDamage(targetInst, player, state.turn, opponent)) return;
    }
    endTurn();
    return;
  }

  if(fixedMultiHitEf){
    if(!opponent.main) return;
    player.main.energy -= move.cost;
    const costMsg = move.cost === 0 ? '消費なし' : `エネルギー${move.cost}枚消費`;
    for(let h=0; h<fixedMultiHitEf.hits; h++){
      if(!opponent.main) break;
      const { dmg, weaknessBonus, halved } = computeDamage(player.main, opponent.main, moveIndex, move.element, true);
      const targetInst = opponent.main;
      if(halved){ targetInst.halfDamageNext = false; }
      log(`${lname(player.main.card.name)}の「${move.name}」${h+1}発目（${move.element}属性・${costMsg}）！ ${lname(opponent.main.card.name)}に${ldmg(dmg)}${weaknessBonus>0?`（弱点+${weaknessBonus}）`:''}`);
      const ended = damageMainAndCheck(opponent, 1-state.turn, dmg, player, state.turn);
      if(ended) return;
      if(applyCounterDamage(targetInst, player, state.turn, opponent)) return;
    }
    endTurn();
    return;
  }

  let effectiveTargetBench = move.targetBench;
  let effectiveBenchIdx = benchTargetIndex;
  const randomTargetEf = effects.find(ef=>ef.type === 'randomBenchOrMain');
  if(randomTargetEf && !move.targetBench && opponent.main && opponent.bench.some(b=>b) && Math.random() < randomTargetEf.chance){
    const idxs = opponent.bench.map((b,i)=>b?i:null).filter(i=>i!==null);
    effectiveBenchIdx = idxs[Math.floor(Math.random()*idxs.length)];
    effectiveTargetBench = true;
    log('不思議な力に導かれ、攻撃がベンチへ逸れた！');
  }

  const targetInstance = effectiveTargetBench ? opponent.bench[effectiveBenchIdx] : opponent.main;
  if(!targetInstance){ log('対象が見当たらないため不発だった。'); render(); return; }

  player.main.energy -= move.cost;

  let actualElement = move.element;
  const randEff = effects.find(ef=>ef.type === 'randomElement');
  if(randEff){
    const pool = randEff.pool && randEff.pool.length ? randEff.pool : [move.element];
    actualElement = pool[Math.floor(Math.random()*pool.length)];
  }
  const wme = effects.find(ef=>ef.type === 'weaknessMatchElement');
  if(wme){
    const elemWeak = (targetInstance.card.weakness||[]).filter(w=>ELEMENT_LIST.includes(w));
    actualElement = elemWeak.length ? elemWeak[Math.floor(Math.random()*elemWeak.length)] : '無';
  }

  const { dmg, weaknessBonus, reduced, halved } = computeDamage(player.main, targetInstance, moveIndex, actualElement, !effectiveTargetBench);
  targetInstance.hp -= dmg;
  if(halved){ targetInstance.halfDamageNext = false; } // 実際に攻撃を受けた時のみ消費する（プレビュー計算では消費しない）

  const costMsg = move.cost === 0 ? '消費なし' : `エネルギー${move.cost}枚消費`;
  const multMsg = weaknessBonus > 0 ? `（弱点+${weaknessBonus}）` : '';
  const elemMsg = (randEff || wme) ? `（${actualElement}属性で発動）` : '';
  log(`${lname(player.main.card.name)}の「${move.name}」（${actualElement}属性・${costMsg}）！${elemMsg} ${lname(targetInstance.card.name)}に${ldmg(dmg)}${multMsg}`);
  if(reduced > 0){
    log(`${lname(targetInstance.card.name)}は結界でダメージを${lreduce(reduced)}した！`);
  }
  if(halved){
    log(`${lname(targetInstance.card.name)}は身代わり札の効果でダメージが半分になった！`);
  }

  const willKO = targetInstance.hp <= 0;

  // 追加効果の処理
  effects.forEach(ef=>{
    if(ef.type === 'selfStatus'){
      applyStatus(player.main, ef.status, state.turn, ef.amount, ef.turns);
    } else if(ef.type === 'inflictStatus'){
      if(targetInstance.hp > 0){
        applyStatus(targetInstance, ef.status, state.turn, ef.amount, ef.turns);
      }
    } else if(ef.type === 'recoil'){
      player.main.hp -= ef.amount;
      log(`${lname(player.main.card.name)}は反動で${ldmg(ef.amount)}を受けた！`);
    } else if(ef.type === 'shield'){
      applyStatus(player.main, 'shield', state.turn, ef.amount, ef.turns);
    } else if(ef.type === 'healBench'){
      const validIdxs = player.bench.map((b,i)=>b?i:null).filter(i=>i!==null);
      if(validIdxs.length){
        let bestIdx = validIdxs[0], bestRatio = 2;
        validIdxs.forEach(i=>{
          const b = player.bench[i];
          const bMax = getMaxHp(b);
          const ratio = b.hp / bMax;
          if(ratio < bestRatio){ bestRatio = ratio; bestIdx = i; }
        });
        healInstance(player.bench[bestIdx], ef.amount);
        log(`${lname(player.bench[bestIdx].card.name)}のHPを${lheal(ef.amount)}した！`);
      }
    } else if(ef.type === 'halfDamageNext'){
      player.main.halfDamageNext = true;
      log(`${lname(player.main.card.name)}は次に受けるダメージが半分になる！`);
    } else if(ef.type === 'healBenchAll'){
      const all = player.bench.filter(Boolean);
      all.forEach(b=>healInstance(b, ef.amount));
      if(all.length) log(`${lname(player.name)}のベンチ全員のHPを${lheal(ef.amount)}した！`);
    } else if(ef.type === 'benchDamage'){
      damageEnemyBench(opponent, player, ef.amount, null);
    } else if(ef.type === 'selfBenchDamage'){
      const all = player.bench.filter(Boolean);
      all.forEach(b=>{ b.hp -= ef.amount; });
      const dead = [];
      player.bench.forEach((b,i)=>{ if(b && b.hp<=0){ dead.push(i); } });
      dead.forEach(i=>{
        const b = player.bench[i];
        log(`${lname(b.card.name)}は倒れた…`);
        player.discard.push(b.card);
        player.bench[i] = null;
      });
      if(all.length) log(`${lname(player.name)}は自分のベンチ全員に${ef.amount}ダメージを与えた！`);
    } else if(ef.type === 'secondaryBenchDamageRandom'){
      const validIdxs = opponent.bench.map((b,i)=>b?i:null).filter(i=>i!==null);
      if(validIdxs.length){
        const pickIdx = validIdxs[Math.floor(Math.random()*validIdxs.length)];
        const b = opponent.bench[pickIdx];
        b.hp -= ef.amount;
        log(`${lname(b.card.name)}に${ldmg(ef.amount)}！`);
        if(b.hp <= 0){
          log(`${lname(b.card.name)}は倒れた…`);
          opponent.discard.push(b.card);
          opponent.bench[pickIdx] = null;
          player.knockouts = (player.knockouts||0) + 1;
          log(`（${lname(player.name)}の撃破数: ${player.knockouts}/5）`);
        }
      }
    } else if(ef.type === 'drawCardsEqualToKnockouts'){
      const n = Math.min(player.knockouts||0, player.deck.length);
      let drew = 0;
      for(let i=0;i<n;i++){ if(player.deck.length){ player.hand.push(player.deck.pop()); drew++; } }
      log(`${lname(player.name)}は撃破数(${player.knockouts||0})分、${drew}枚引いた。`);
    } else if(ef.type === 'selfGiveEnergy'){
      player.main.energy = (player.main.energy||0) + ef.amount;
      log(`${lname(player.main.card.name)}は自分に霊力エネルギーを${ef.amount}枚つけた！`);
    } else if(ef.type === 'selfGiveRetreatEnergy'){
      player.main.retreatEnergy = (player.main.retreatEnergy||0) + ef.amount;
      log(`${lname(player.main.card.name)}は自分に交代エネルギーを${ef.amount}枚つけた！`);
    } else if(ef.type === 'benchBonusVsType'){
      damageEnemyBench(opponent, player, ef.amount, ef.targetType);
    } else if(ef.type === 'drawCard'){
      let drew = 0;
      for(let i=0;i<ef.amount;i++){ if(player.deck.length){ player.hand.push(player.deck.pop()); drew++; } }
      log(`${lname(player.name)}は山札から${drew}枚引いた。`);
    } else if(ef.type === 'drawOnKO' && willKO){
      let drew = 0;
      for(let i=0;i<ef.amount;i++){ if(player.deck.length){ player.hand.push(player.deck.pop()); drew++; } }
      log(`撃破ボーナスで${lname(player.name)}は${drew}枚引いた！`);
    } else if(ef.type === 'selfDamageOnKO' && willKO){
      player.main.hp -= ef.amount;
      log(`${lname(player.main.card.name)}は反動で${ldmg(ef.amount)}を受けた！`);
    } else if(ef.type === 'returnHandToDeck'){
      if(opponent.hand.length){
        const ridx = Math.floor(Math.random()*opponent.hand.length);
        const returned = opponent.hand.splice(ridx,1)[0];
        opponent.deck.push(returned);
        shuffle(opponent.deck);
        log(`${lname(opponent.name)}の手札から「${returned.name}」を山札に戻した！`);
      }
    } else if(ef.type === 'preventRetreat'){
      opponent.retreatLockedTurns = Math.max(opponent.retreatLockedTurns||0, ef.turns);
      log(`${lname(opponent.name)}は${ef.turns}ターンの間、交代ができなくなった！`);
    } else if(ef.type === 'revealHandCards'){
      const pool = [...opponent.hand];
      const shownNames = [];
      for(let i=0;i<Math.min(ef.count,pool.length);i++){
        const ridx = Math.floor(Math.random()*pool.length);
        shownNames.push(pool.splice(ridx,1)[0].name);
      }
      log(shownNames.length ? `${lname(opponent.name)}の手札を覗き見た：${shownNames.join('、')}` : `${lname(opponent.name)}の手札は空だった。`);
    } else if(ef.type === 'discardRandomHandCard'){
      const discardCount = ef.amount || 1;
      const discardedNames = [];
      for(let i=0;i<discardCount && opponent.hand.length;i++){
        const ridx = Math.floor(Math.random()*opponent.hand.length);
        const discarded = opponent.hand.splice(ridx,1)[0];
        opponent.discard.push(discarded);
        discardedNames.push(discarded.name);
      }
      if(discardedNames.length){
        log(`${lname(opponent.name)}の手札から「${discardedNames.join('」「')}」を捨てさせた！`);
      }
    } else if(ef.type === 'benchBonusVsWeakness'){
      damageEnemyBench(opponent, player, ef.amount, null, b=>b.card.weakness.includes(ef.targetWeakness));
    } else if(ef.type === 'reverseWeakness' && targetInstance.hp > 0){
      targetInstance.reverseWeaknessTurns = ef.turns;
      log(`${lname(targetInstance.card.name)}は${ef.turns}ターンの間、無属性以外すべてが弱点になった！`);
    }
  });

  if(player.knockouts >= 5){ endGame(state.turn); return; }

  // 反動などで自分のメインが倒れていないか確認
  if(player.main && player.main.hp <= 0){
    log(`${lname(player.main.card.name)}は倒れた…`);
    player.discard.push(player.main.card);
    const dyingSelfInst = player.main;
    player.main = null;
    opponent.knockouts = (opponent.knockouts||0) + 1;
    log(`（${lname(opponent.name)}の撃破数: ${opponent.knockouts}/5）`);
    checkDeathCurseRetaliation(dyingSelfInst, state.turn);
    if(opponent.knockouts >= 5){ endGame(1-state.turn); return; }
    const hasSelfBench = player.bench.some(b=>b!==null);
    if(hasSelfBench){
      const pending = triggerPromotion(state.turn, ()=>endTurn());
      if(pending) return; // 選択待ち。resolvePromotionがendTurnを呼ぶ
    }
    // ベンチが空でも、5体撃破に達していなければ試合は続行する（次のターンにキャラを出せる可能性がある）
  }

  // 攻撃対象（メイン or ベンチ）が倒れていないか確認
  if(targetInstance.hp <= 0){
    log(`${lname(targetInstance.card.name)}は倒れた…`);
    opponent.discard.push(targetInstance.card);
    player.knockouts = (player.knockouts||0) + 1;
    log(`（${lname(player.name)}の撃破数: ${player.knockouts}/5）`);
    if(player.knockouts >= 5){ endGame(state.turn); return; }

    checkDeathCurseRetaliation(targetInstance, 1-state.turn);
    if(effectiveTargetBench){
      opponent.bench[effectiveBenchIdx] = null;
    } else {
      opponent.main = null;
      const hasOppBench = opponent.bench.some(b=>b!==null);
      if(hasOppBench){
        const opponentIdx = 1-state.turn;
        const pending = triggerPromotion(opponentIdx, ()=>finishAttackTurn(player, opponent, effects));
        if(pending) return; // 選択待ち。resolvePromotionがfinishAttackTurnを呼ぶ
      }
      // ベンチが空でも、5体撃破に達していなければ試合は続行する
    }
  }

  if(applyCounterDamage(targetInstance, player, state.turn, opponent)) return;

  finishAttackTurn(player, opponent, effects);
}

function applyBenchBuffToTargets(player, indices, effectType, amount){
  indices.forEach(i=>{
    const b = player.bench[i];
    if(!b) return;
    if(effectType === 'benchGiveEnergy'){
      b.energy = (b.energy||0) + amount;
      log(`${lname(b.card.name)}に霊力エネルギーを${amount}枚つけた！`);
    } else if(effectType === 'benchGiveRetreatEnergy'){
      b.retreatEnergy = (b.retreatEnergy||0) + amount;
      log(`${lname(b.card.name)}に交代エネルギーを${amount}枚つけた！`);
    }
  });
}

function triggerBenchBuff(player, playerIdx, effectType, amount, count, forceRandom){
  const validIdxs = player.bench.map((b,i)=>b?i:null).filter(i=>i!==null);
  if(validIdxs.length === 0) return false;
  const needed = Math.min(count, validIdxs.length);
  if(forceRandom || isAiControlled(playerIdx) || validIdxs.length <= needed){
    let targets = validIdxs;
    if(validIdxs.length > needed){ shuffle(validIdxs); targets = validIdxs.slice(0, needed); }
    applyBenchBuffToTargets(player, targets, effectType, amount);
    return false;
  }
  state.benchBuffPending = { playerIdx, effectType, amount, count: needed, chosen: [] };
  log(`${lname(player.name)}は対象を${needed}体選んでください。`);
  render();
  return true;
}

function resolveBenchBuffChoice(benchIndex){
  if(!state.benchBuffPending) return;
  const pending = state.benchBuffPending;
  const player = state.players[pending.playerIdx];
  if(!player.bench[benchIndex]) return;
  if(pending.chosen.includes(benchIndex)) return;
  pending.chosen.push(benchIndex);
  applyBenchBuffToTargets(player, [benchIndex], pending.effectType, pending.amount);
  if(pending.chosen.length >= pending.count){
    state.benchBuffPending = null;
    endTurn();
  } else {
    render();
  }
}

function finishAttackTurn(player, opponent, effects){
  // selfSwapAfter：自分のベンチと自動で入れ替わる
  if(effects.some(ef=>ef.type === 'selfSwapAfter') && player.main){
    const bi = player.bench.findIndex(b=>b!==null);
    if(bi >= 0){
      const tmp = player.main;
      player.main = player.bench[bi];
      player.bench[bi] = tmp;
      clearStatusOnBenched(tmp);
      log(`${lname(player.main.card.name)}とメインが入れ替わった！`);
    }
  }

  // forcedSwapThenStatus：相手に入れ替えを強制し、その後で状態異常を付与
  const fsEf = effects.find(ef=>ef.type === 'forcedSwapThenStatus');
  if(fsEf && opponent.main){
    useForcedSwap(fsEf.status, true);
    if(state.forcedSwapPending) return; // 相手の選択待ち。resolveForcedSwapがendTurnを呼ぶ
  }

  // benchGiveEnergy／benchGiveRetreatEnergy：ベンチへの付与先を選ぶ（人間なら選択、AIは自動）
  const bgeEf = effects.find(ef=>ef.type === 'benchGiveEnergy');
  if(bgeEf){
    const pending = triggerBenchBuff(player, state.turn, 'benchGiveEnergy', bgeEf.amount||1, bgeEf.count||1, bgeEf.forceRandom);
    if(pending) return; // 選択待ち。resolveBenchBuffChoiceがendTurnを呼ぶ
  }
  const bgreEf = effects.find(ef=>ef.type === 'benchGiveRetreatEnergy');
  if(bgreEf){
    const pending = triggerBenchBuff(player, state.turn, 'benchGiveRetreatEnergy', bgreEf.amount||1, bgreEf.count||1, bgreEf.forceRandom);
    if(pending) return; // 選択待ち。resolveBenchBuffChoiceがendTurnを呼ぶ
  }

  endTurn();
}

/* ---- 簡易AI ---- */
function aiTakeTurn(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    let progressed = true;
    while(progressed){
      progressed = false;
      const charIndices = player.hand
        .map((c,i)=>(!c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport) ? i : null)
        .filter(i=>i!==null);
      for(const idx of charIndices){
        const card = player.hand[idx];
        const cardStage = card.cardStage || 'easy';
        let playable;
        if(cardStage === 'easy'){
          playable = !player.main || player.bench.some(b=>b===null);
        } else {
          const requiredPrevStage = STAGE_ORDER[STAGE_ORDER.indexOf(cardStage)-1];
          const canEvolve = inst => inst && inst.card.id === card.id && (inst.stage||'easy') === requiredPrevStage && !inst.blockedThisTurn;
          playable = canEvolve(player.main) || player.bench.some(b=>canEvolve(b));
        }
        if(playable){
          onHandCardClick(idx);
          progressed = true;
          break;
        }
      }
    }
    aiEnergyStep();
  }, 600);
}
function aiAttachEnergyToMain(player){
  const idx = player.hand.findIndex(c=>c.isEnergy);
  if(idx < 0) return false;
  player.main.energy++;
  player.hand.splice(idx,1);
  state.energyAttachedThisTurn++;
  log(`${player.main.card.name}に霊力エネルギーを1枚つけた（このターン${state.energyAttachedThisTurn}/2枚、現在${player.main.energy}枚）。`);
  return true;
}
function aiAttachRetreatEnergyToMain(player){
  const idx = player.hand.findIndex(c=>c.isRetreatEnergy);
  if(idx < 0) return false;
  player.main.retreatEnergy = (player.main.retreatEnergy||0) + 1;
  player.hand.splice(idx,1);
  log(`${player.main.card.name}に交代エネルギーを1枚つけた（現在${player.main.retreatEnergy}枚）。`);
  return true;
}
function aiAttachItemToMain(player){
  const itemIndices = player.hand.map((c,i)=>c.isItem?i:null).filter(i=>i!==null);
  if(itemIndices.length === 0) return false;
  // 状況に応じて優先したい効果の順番を決める
  const priority = [];
  if(player.main.card.weakness && player.main.card.weakness.length > 0) priority.push('negateWeakness');
  if(player.main.hp < getMaxHp(player.main) * 0.5) priority.push('hp');
  priority.push('atk');
  priority.push('counterDamage');
  priority.push('hp');
  priority.push('benchInvulnerable');

  let idx = itemIndices[0];
  outer:
  for(const key of priority){
    for(const i of itemIndices){
      if(player.hand[i].effect && player.hand[i].effect[key]){ idx = i; break outer; }
    }
  }
  const card = player.hand[idx];
  if(player.main.item){ player.discard.push(player.main.item); }
  player.main.item = card;
  if(card.effect.hp){ player.main.maxHpBonus = (player.main.maxHpBonus||0) + card.effect.hp; player.main.hp += card.effect.hp; }
  player.hand.splice(idx,1);
  state.itemAttachedThisTurn = true;
  log(`${player.main.card.name}に「${card.name}」を持たせた！（${card.desc}）`);
  return true;
}
function aiEnergyStep(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    if(player.main && state.energyAttachedThisTurn < 2 && player.main.energy < 4){
      aiAttachEnergyToMain(player);
      if(state.energyAttachedThisTurn < 2 && player.main.energy < 4){
        aiAttachEnergyToMain(player);
      }
    }
    if(player.main && (player.main.retreatEnergy||0) < 1){
      aiAttachRetreatEnergyToMain(player);
    }
    aiItemStep();
  }, 600);
}
function aiItemStep(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    if(player.main && !state.itemAttachedThisTurn && !player.main.item){
      aiAttachItemToMain(player);
    }
    aiSupportStep();
  }, 600);
}
function aiSupportStep(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    const opponent = state.players[1-aiActingIdx];
    // サポートカードは無制限に使えるので、使えるものは一通り使う
    let progressed = true;
    while(progressed){
      progressed = false;
      const supportIndices = player.hand.map((c,i)=>c.isSupport?i:null).filter(i=>i!==null);
      for(const idx of supportIndices){
        const card = player.hand[idx];
        const t = card.effectType;
        if(t === 'healMain' && player.main && player.main.hp >= getMaxHp(player.main)) continue; // 満タンなら他を探す
        if(t==='drawCards' || t==='healMain' || t==='searchRandomChar' || t==='searchRandomEasy'){
          resolveNoTargetCard(player, card);
          player.hand.splice(idx,1);
          progressed = true;
          break;
        } else if(t === 'cureStatus' && player.main && player.main.status){
          player.main.status = null;
          player.hand.splice(idx,1);
          log(`「${card.name}」を使用 → ${lname(player.main.card.name)}の状態異常を解除`);
          progressed = true;
          break;
        } else if(t === 'revealHandCards'){
          resolveNoTargetCard(player, card);
          player.hand.splice(idx,1);
          progressed = true;
          break;
        } else if(t === 'scoutTop3'){
          useScoutTop3(player, 1);
          player.hand.splice(idx,1);
          progressed = true;
          break;
        } else if(t === 'negateWeaknessSelf' && player.main && !player.main.weaknessNegatedTurns){
          resolveNoTargetCard(player, card);
          player.hand.splice(idx,1);
          progressed = true;
          break;
        }
      }
    }
    aiSpecialStep();
  }, 500);
}
function aiEnergyPlusEnablesLethal(player, opponent, amount){
  if(!player.main || !opponent.main) return false;
  return player.main.card.moves.some((mv,mi)=>{
    if(mv.targetBench) return false;
    const effects = mv.effects || [];
    if(effects.some(ef=>['multiHitRandom','multiHitBenchRandom','fixedMultiHitMain','randomBenchOrMain'].includes(ef.type))) return false;
    if(mv.cost <= player.main.energy) return false; // 既に使えるなら対象外
    if(mv.cost > player.main.energy + amount) return false; // それでも足りないなら対象外
    const { dmg } = computeDamage(player.main, opponent.main, mi, mv.element, true);
    return dmg >= opponent.main.hp;
  });
}

function aiSpecialStep(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    if(!state.specialUsedThisTurn){
      const specialIndices = player.hand.map((c,i)=>c.isSpecial?i:null).filter(i=>i!==null);
      // トドメを刺せるようになるエネルギー追加カードがあれば最優先で使う
      specialIndices.sort((a,b)=>{
        const aCard = player.hand[a], bCard = player.hand[b];
        const aLethal = aCard.effectType==='energyPlus' && aiEnergyPlusEnablesLethal(player, state.players[1-aiActingIdx], aCard.amount);
        const bLethal = bCard.effectType==='energyPlus' && aiEnergyPlusEnablesLethal(player, state.players[1-aiActingIdx], bCard.amount);
        return (bLethal?1:0) - (aLethal?1:0);
      });
      for(const idx of specialIndices){
        const card = player.hand[idx];
        const t = card.effectType;
        if(t === 'healMain' && player.main && player.main.hp >= getMaxHp(player.main)) continue; // 満タンなら他のカードを探す
        if(t === 'drawCards' || t === 'healMain' || t === 'searchRandomChar' || t === 'searchRandomEasy' || t === 'redrawHand'){
          resolveNoTargetCard(player, card);
          const actualIndex = player.hand.indexOf(card);
          if(actualIndex >= 0) player.hand.splice(actualIndex,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'forcedSwap'){
          log(`「${card.name}」を使用`);
          useForcedSwap();
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'healAny' && player.main && player.main.hp < getMaxHp(player.main)){
          healInstance(player.main, card.amount);
          log(`「${card.name}」を使用 → ${lname(player.main.card.name)}のHPを${lheal(card.amount)}`);
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'energyPlus' && player.main){
          player.main.energy += card.amount;
          log(`「${card.name}」を使用 → ${lname(player.main.card.name)}にエネルギー${card.amount}個追加`);
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'energyMinus'){
          const opponent = state.players[1-aiActingIdx];
          if(opponent.main && opponent.main.energy > 0){
            const before = opponent.main.energy;
            opponent.main.energy = Math.max(0, opponent.main.energy-1);
            log(`「${card.name}」を使用 → ${lname(opponent.main.card.name)}のエネルギーを1個減少（${before}→${opponent.main.energy}）`);
            player.hand.splice(idx,1);
            state.specialUsedThisTurn = true;
            break;
          }
        } else if(t === 'teamShield'){
          resolveNoTargetCard(player, card);
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'chooseFromTwo'){
          log(`「${card.name}」を使用`);
          useChooseFromTwo(player, 1);
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        } else if(t === 'gapSwap'){
          const opponent = state.players[1-aiActingIdx];
          const hasDamagedBench = opponent.bench.some(b=>b && b.hp < getMaxHp(b));
          if(opponent.main && hasDamagedBench){
            log(`「${card.name}」を使用`);
            useGapSwap(player, opponent, 1);
            player.hand.splice(idx,1);
            state.specialUsedThisTurn = true;
            break;
          }
        } else if(t === 'nukeBench'){
          const opponent = state.players[1-aiActingIdx];
          if(opponent.bench.some(b=>b)){
            resolveNoTargetCard(player, card);
            player.hand.splice(idx,1);
            state.specialUsedThisTurn = true;
            break;
          }
        } else if(t === 'kamikakushi'){
          const hasValidTarget = player.bench.some(b=>b && b.hp >= getMaxHp(b)/2);
          if(hasValidTarget){
            resolveNoTargetCard(player, card);
            player.hand.splice(idx,1);
            state.specialUsedThisTurn = true;
            break;
          }
        } else if(t === 'halfDamageNext' && player.main && !player.main.halfDamageNext){
          resolveNoTargetCard(player, card);
          player.hand.splice(idx,1);
          state.specialUsedThisTurn = true;
          break;
        }
      }
    }
    aiAttackStep();
  }, 500);
}
function aiPickBestMove(player, opponent){
  const difficulty = state.aiDifficulty || 'normal';
  let best = null;
  const candidates = [];
  const consider = (candidate) => {
    candidates.push(candidate);
    if(!best) { best = candidate; return; }
    // 撃破できる手を最優先。両方撃破可能／両方不可なら威力の高い方を選ぶ
    if(candidate.lethal && !best.lethal){ best = candidate; return; }
    if(!candidate.lethal && best.lethal) return;
    if(candidate.dmg > best.dmg){ best = candidate; }
  };
  player.main.card.moves.forEach((mv,mi)=>{
    if(mv.cost > player.main.energy) return;
    const effects = mv.effects || [];
    const multiHitEf = effects.find(ef=>ef.type === 'multiHitRandom');
    if(multiHitEf){
      if(!opponent.main && !opponent.bench.some(b=>b)) return;
      const perHit = multiHitEf.dmgPerHit + stageIdx(player.main) * (multiHitEf.scalePerStage||0);
      const estDmg = perHit * multiHitEf.hits;
      consider({ index:mi, dmg: estDmg, lethal:false });
      return;
    }
    const benchMultiHitEf = effects.find(ef=>ef.type === 'multiHitBenchRandom');
    if(benchMultiHitEf){
      if(!opponent.bench.some(b=>b)) return;
      const perHit = benchMultiHitEf.dmgPerHit + stageIdx(player.main) * (benchMultiHitEf.scalePerStage||0);
      const estDmg = perHit * benchMultiHitEf.hits;
      consider({ index:mi, dmg: estDmg, lethal:false });
      return;
    }
    const fixedMultiHitEf = effects.find(ef=>ef.type === 'fixedMultiHitMain');
    if(fixedMultiHitEf){
      if(!opponent.main) return;
      const { dmg } = computeDamage(player.main, opponent.main, mi, mv.element, true);
      const totalDmg = dmg * fixedMultiHitEf.hits;
      consider({ index:mi, dmg: totalDmg, lethal: totalDmg >= opponent.main.hp });
      return;
    }
    if(mv.targetBench){
      // 一番HPが低い（倒しやすい）ベンチを狙う
      let bi = -1, bestHp = Infinity;
      opponent.bench.forEach((b,i)=>{ if(b && b.hp < bestHp){ bestHp = b.hp; bi = i; } });
      if(bi < 0) return;
      const { dmg } = computeDamage(player.main, opponent.bench[bi], mi, mv.element, false);
      consider({ index:mi, dmg, benchTarget:bi, lethal: dmg >= opponent.bench[bi].hp });
      return;
    }
    if(!opponent.main) return;
    // randomBenchOrMain は的中確率を考慮した期待値ベースで比較する
    const randomTargetEf = effects.find(ef=>ef.type === 'randomBenchOrMain');
    if(randomTargetEf && opponent.bench.some(b=>b)){
      const estElement1 = estimateEffectiveElement(mv, effects, opponent.main);
      const { dmg:mainDmg } = computeDamage(player.main, opponent.main, mi, estElement1, true);
      let bi = -1, bestHp = Infinity;
      opponent.bench.forEach((b,i)=>{ if(b && b.hp < bestHp){ bestHp = b.hp; bi = i; } });
      const benchInst = bi>=0 ? opponent.bench[bi] : null;
      const estElement2 = benchInst ? estimateEffectiveElement(mv, effects, benchInst) : mv.element;
      const benchDmg = benchInst ? computeDamage(player.main, benchInst, mi, estElement2, false).dmg : 0;
      const expected = mainDmg*(1-randomTargetEf.chance) + benchDmg*randomTargetEf.chance;
      consider({ index:mi, dmg: expected, lethal: mainDmg >= opponent.main.hp && (benchInst ? benchDmg >= benchInst.hp : true) });
      return;
    }
    const estElement = estimateEffectiveElement(mv, effects, opponent.main);
    const { dmg } = computeDamage(player.main, opponent.main, mi, estElement, true);
    consider({ index:mi, dmg, lethal: dmg >= opponent.main.hp });
  });
  // 「弱い」設定では、たまに最善手ではなくランダムな手を選ぶ（トドメの一撃は逃さない）
  if(difficulty === 'weak' && candidates.length > 1 && !(best && best.lethal) && Math.random() < 0.35){
    const pick = candidates[Math.floor(Math.random()*candidates.length)];
    return pick;
  }
  return best;
}

function aiConsiderRetreat(player){
  if(!player.main || state.retreatUsedThisTurn) return false;
  const difficulty = state.aiDifficulty || 'normal';
  const threshold = difficulty === 'weak' ? 0.15 : (difficulty === 'strong' ? 0.4 : 0.3);
  const maxHp = getMaxHp(player.main);
  const ratio = player.main.hp / maxHp;
  if(ratio > threshold) return false; // まだ十分戦える
  // ベンチに、より安全（HP割合が高い）なキャラがいれば交代する
  let bestIdx = -1, bestRatio = ratio;
  player.bench.forEach((b,i)=>{
    if(!b) return;
    const r = b.hp / getMaxHp(b);
    if(r > bestRatio + 0.15){ bestRatio = r; bestIdx = i; }
  });
  if(bestIdx < 0) return false;
  retreatSwap(bestIdx);
  return true;
}

function aiAttackStep(){
  setTimeout(()=>{
    if(state.gameOver) return;
    const player = state.players[aiActingIdx];
    const opponent = state.players[1-aiActingIdx];
    if(player.main){
      aiConsiderRetreat(player);
    }
    if(player.main){
      const best = aiPickBestMove(player, opponent);
      if(best){ onUseMove(best.index, best.benchTarget); } else { endTurn(); }
    } else {
      endTurn();
    }
  }, 600);
}

function getCharacterMoveElements(c){
  const set = new Set();
  (c.moves || []).forEach(m=>{
    if(m.element) set.add(m.element);
    (m.effects || []).forEach(ef=>{
      if(ef.type === 'addElement' && ef.element) set.add(ef.element);
      if(ef.type === 'randomElement') (ef.pool || []).forEach(el=>set.add(el));
    });
  });
  return [...set];
}

function characterMatchesFilter(c, filter){
  const typeOk = !filter.types.length || filter.types.includes(c.type);
  const moveElements = getCharacterMoveElements(c);
  const elementOk = !filter.elements.length || filter.elements.some(el=>moveElements.includes(el));
  const weaknessOk = !filter.weaknesses.length || filter.weaknesses.some(w=>c.weakness.includes(w));
  return typeOk && elementOk && weaknessOk;
}

function uniqueCharacterTypes(){
  return [...new Set(CHAR_DB.map(c=>c.type))];
}

function uniqueMoveElements(){
  const set = new Set();
  CHAR_DB.forEach(c=>getCharacterMoveElements(c).forEach(el=>set.add(el)));
  return [...set];
}

function uniqueWeaknesses(){
  const set = new Set();
  CHAR_DB.forEach(c=>(c.weakness||[]).forEach(w=>set.add(w)));
  return [...set];
}

function analyzeDeckBias(selections){
  const messages = [];
  let easy=0,normal=0,hard=0,lunatic=0;
  const charTypes = {}, weaknessCount = {}, elementCount = {};
  const selectedCharIds = [];
  Object.entries(selections.chars).forEach(([id,st])=>{
    const total = st.easy+st.normal+st.hard+st.lunatic;
    if(total === 0) return;
    selectedCharIds.push(id);
    easy+=st.easy; normal+=st.normal; hard+=st.hard; lunatic+=st.lunatic;
    const c = CHAR_DB.find(x=>x.id===id);
    if(!c) return;
    charTypes[c.type] = (charTypes[c.type]||0) + total;
    c.weakness.forEach(w=>{ weaknessCount[w] = (weaknessCount[w]||0) + total; });
    getCharacterMoveElements(c).forEach(e=>{ elementCount[e] = (elementCount[e]||0) + 1; });
  });
  const charTotal = easy+normal+hard+lunatic;

  if(charTotal === 0){
    messages.push({level:'warn', text:'キャラクターが1体も選択されていません。'});
    return messages;
  }

  if(easy === 0){
    messages.push({level:'warn', text:'easy段階のキャラが0枚です。このままでは場にキャラを出せません。'});
  } else if(easy < charTotal * 0.3){
    messages.push({level:'warn', text:`easy段階の割合が少なめです（${easy}/${charTotal}枚）。序盤にキャラを展開しづらいかもしれません。`});
  }

  if(lunatic > 0 && hard === 0){
    messages.push({level:'warn', text:'hard段階が0枚なのにlunatic段階があります。進化チェーンが繋がっているか確認してください。'});
  }

  const distinctChars = selectedCharIds.length;
  if(distinctChars > 0 && distinctChars <= 2){
    messages.push({level:'info', text:`採用キャラが${distinctChars}種類と少数精鋭型です。特定キャラへの依存度が高い分、対策されると弱くなりやすいです。`});
  }

  const typeEntries = Object.entries(charTypes).sort((a,b)=>b[1]-a[1]);
  if(typeEntries.length === 1){
    messages.push({level:'warn', text:`採用キャラの種族が「${typeEntries[0][0]}」1種類に偏っています。同じ弱点を突かれると総崩れになりやすいです。`});
  }

  const weakEntries = Object.entries(weaknessCount).sort((a,b)=>b[1]-a[1]);
  if(weakEntries.length && weakEntries[0][1] >= charTotal * 0.5){
    messages.push({level:'warn', text:`デッキ全体の半数以上が「${weakEntries[0][0]}」を弱点として持っています。この弱点を突かれると連鎖的に不利になります。`});
  }

  const allElements = ['無','木','火','水','氷','岩','闇','光','星'];
  const missingElements = allElements.filter(e=>!elementCount[e]);
  if(missingElements.length >= 6){
    messages.push({level:'info', text:`わざの属性の種類が少なめです（${allElements.length-missingElements.length}／${allElements.length}種類）。相手の弱点を突ける場面が限られるかもしれません。`});
  }

  if(selections.energy < 18){
    messages.push({level:'warn', text:`霊力エネルギーが${selections.energy}枚と少なめです。わざを使う燃料が不足しがちになるかもしれません。`});
  } else if(selections.energy > 32){
    messages.push({level:'info', text:`霊力エネルギーが${selections.energy}枚と多めです。エネルギー切れの心配は少ない反面、他のカード枠を圧迫しています。`});
  }

  let itemsTotal=0; Object.values(selections.items).forEach(v=>itemsTotal+=v);
  let specialsTotal=0; Object.values(selections.specials).forEach(v=>specialsTotal+=v);
  let supportsTotal=0; Object.values(selections.supports).forEach(v=>supportsTotal+=v);
  if(itemsTotal === 0) messages.push({level:'info', text:'持ち物カードが1枚もありません。'});
  if(specialsTotal === 0) messages.push({level:'info', text:'特殊カードが1枚もありません。'});
  if(supportsTotal === 0) messages.push({level:'info', text:'サポートカードが1枚もありません。'});

  if(messages.length === 0){
    messages.push({level:'good', text:'目立った偏りは見つかりませんでした。バランスの良いデッキです。'});
  }
  return messages;
}

            <li>相手のキャラを合計<span class="manual-sub">5体撃破</span>すると勝利します（画面上部の「撃破: ○/5」で確認できます）。</li>
            <li>相手の場（メイン・ベンチ全て）にキャラが1体もいなくなった時点で、その相手の負けになります。</li>
            <li>山札がなくなった状態で自分の番になった場合、その時点で負けになります。</li>
            <li>ゲーム開始時、手札にeasy段階のキャラクターカードが1枚もない場合は手札を引き直せます（最大3回）。3回引き直してもeasyキャラが手札に来なければ、その時点で負けになります。</li>
          </ul>

          <h4>■ カードの種類</h4>
          <table>
            <tr><th>種類</th><th>説明</th></tr>
            <tr><td>キャラクターカード</td><td>メインやベンチに出して戦わせる本体。easy→normal→hard→lunaticの4段階に進化する。</td></tr>
            <tr><td>霊力エネルギー</td><td>わざを使うのに必要。メインかベンチのキャラにドラッグして付ける（1ターンに2枚まで）。</td></tr>
            <tr><td>持ち物カード</td><td>キャラ1体に1つだけ持たせられる装備品。HPや攻撃力の強化など効果はカードごとに異なる。</td></tr>
            <tr><td>特殊カード</td><td>強力な効果を持つが、<span class="manual-sub">1ターンに1枚まで</span>しか使えない。</td></tr>
            <tr><td>サポートカード</td><td>比較的軽い効果だが、<span class="manual-sub">1ターンに何枚でも</span>使える。</td></tr>
          </table>

          <h4>■ キャラクターカードの見方</h4>
          <ul>
            <li><span class="manual-sub">HP</span>：キャラの体力。0になると撃破される。</li>
            <li><span class="manual-sub">種族</span>：人間・妖怪・鬼・幽霊・妖精・神・月人・魔法使いなど。一部のわざの効果に関係する。</li>
            <li><span class="manual-sub">弱点</span>：弱点に一致する種族・属性でわざを当てると追加ダメージが入る（後述）。</li>
            <li><span class="manual-sub">わざ</span>：それぞれに属性・消費エネルギー（コスト）・ダメージ・追加効果がある。</li>
          </ul>

          <h4>■ 対戦の流れ（1ターンの動き）</h4>
          <ul>
            <li>先攻・後攻はランダムに決まります。</li>
            <li>自分のターンが来ると、山札から1枚引く。</li>
            <li>手札のキャラクターカード（easy段階）をタップするとメインまたはベンチに出せる。</li>
            <li>霊力エネルギーや持ち物カードは、手札でタップ→付けたいキャラをタップで装着。</li>
            <li>特殊・サポートカードは条件に応じて使用（対象が必要なものは同様にタップで選ぶ）。</li>
            <li>メインのわざをタップすると相手を攻撃できる（消費エネルギーが足りている必要あり）。攻撃は1ターンに1回まで。</li>
            <li>ベンチのキャラをタップするとメインと交代できる（1ターンに1回まで）。</li>
            <li>行動が終わったら「ターン終了」ボタンを押す。</li>
          </ul>

          <h4>■ 属性と弱点ダメージ</h4>
          <p>わざには「無・木・火・水・氷・岩・闇・光・星」のいずれかの属性があります。攻撃側の種族・属性が、相手（<span class="manual-sub">メインのみ</span>。ベンチを狙うわざでは発生しません）の弱点に一致していると、ボーナスダメージが入ります。</p>
          <ul>
            <li>弱点に1つ一致：+30ダメージ</li>
            <li>弱点に2つ一致：+60ダメージ</li>
          </ul>
          <p>追加効果（〇〇に+△△など）によるダメージは、弱点ボーナスの後にさらに加算されます。</p>

          <h4>■ 進化</h4>
          <p>キャラクターカードにはeasy・normal・hard・lunaticの4段階があります。easy段階のカードだけが新規にメイン・ベンチへ出せます。normal以降のカードは、場にいる一つ前の段階の同じキャラをタップして進化させて使います（例：normalカードなら、場にいるeasy段階の同じキャラを進化させる）。</p>
          <ul>
            <li>進化すると、HPと攻撃力が段階ごとに上昇します。</li>
            <li><span class="manual-sub">出したばかりのターン</span>、または<span class="manual-sub">進化したばかりのターン</span>は、そのキャラをさらに進化させることはできません（1ターンでeasy→normal→hardのように一気に進化することは不可）。</li>
          </ul>

          <h4>■ 状態異常</h4>
          <table>
            <tr><th>状態</th><th>効果</th></tr>
            <tr><td>やけど</td><td>効果が発動するたびにダメージを受ける</td></tr>
            <tr><td>凍結</td><td>攻撃力が下がる（わざの威力が75%になる）</td></tr>
            <tr><td>再生</td><td>効果が発動するたびにHPが回復する</td></tr>
            <tr><td>結界</td><td>受けるダメージを一定値だけ軽減する</td></tr>
            <tr><td>道連れの呪い</td><td>かかっているキャラが倒れると、相手に反撃ダメージが入る</td></tr>
          </table>
          <p>状態異常は、<span class="manual-sub">かかっている本人のターンが終了するとき</span>に効果が発動し、そのまま消えます（自分にかかっているものは自分のターン終了時、相手にかかっているものは相手のターン終了時）。</p>

          <h4>■ 交代・繰り上げ</h4>
          <ul>
            <li>ベンチのキャラをタップすると、メインと入れ替えられます（1ターンに1回まで）。</li>
            <li>メインのキャラが倒された場合、ベンチにキャラが残っていれば、そこから新しいメインを選んで繰り上げます（自分の場合はどのキャラにするか選べます。CPUは自動で選びます）。</li>
            <li>ベンチもメインもいなくなった時点でその時点の敗北になります。</li>
          </ul>

          <h4>■ デッキ編成</h4>
          <p>1つのデッキはちょうど70枚で組みます。「おまかせで組む」ボタンを押すと、キャラクター・霊力エネルギー・交代エネルギー・持ち物・特殊・サポートのバランスを取りながら自動でランダムに組んでくれます。手動で調整したい場合は、各カードの＋／－ボタンで枚数を変更してください。</p>

          <h4>■ 困ったときは</h4>
          <p>この説明書はデッキ編成画面・対戦画面のどちらからでも、いつでも開けます。ルールを忘れてしまったときはこのボタンを押してください。</p>

        </div>
      </div>
    </div>`;
}

  const sel = builder.selections;
  const playerLabel = builder.mode === 'hotseat' ? `プレイヤー${builder.playerIdx+1}` : 'あなた';

  const itemCards = ITEM_DB.map(it=>{
    const n = sel.items[it.id] || 0;

  const specialCards = SPECIAL_DB.map(sp=>{
    const n = sel.specials[sp.id] || 0;
    const body = `<div class="character-select-desc-row">${sp.desc}</div>`;
    const controls = `<div class="builder-card-controls single-stepper-wrap">
      <span class="character-select-stage-label">枚数（5枚まで）</span>
      <div class="stepper">
        <button data-special="${sp.id}" data-delta="-1" ${n<=0?'disabled':''}>−</button>
        <span>${n}</span>
        <button data-special="${sp.id}" data-delta="1" ${n>=5?'disabled':''}>＋</button>
      </div>
    </div>`;
    return renderBuilderCard('#8a4fbf', sp.name, '特殊カード', body, controls);

  const supportCards = SUPPORT_DB.map(su=>{
    const n = sel.supports[su.id] || 0;
    const body = `<div class="character-select-desc-row">${su.desc}</div>`;
    const controls = `<div class="builder-card-controls single-stepper-wrap">
      <span class="character-select-stage-label">枚数（5枚まで）</span>
      <div class="stepper">
        <button data-support="${su.id}" data-delta="-1" ${n<=0?'disabled':''}>−</button>
        <span>${n}</span>
        <button data-support="${su.id}" data-delta="1" ${n>=5?'disabled':''}>＋</button>
      </div>
    </div>`;
    return renderBuilderCard('#2f9e7f', su.name, 'サポート', body, controls);
  }).join('');

  const total = builderTotal();
  let charTotal = 0, easyTotal = 0;
  Object.values(sel.chars).forEach(stages=>{ STAGE_ORDER.forEach(st=>{ charTotal += stages[st]; }); easyTotal += stages.easy; });
  const exact = total === DECK_SIZE;
  const warn2 = charTotal < 3 ? `<div class="warn">キャラクターカードは3枚以上推奨です（イージーがないとメインやベンチに出せません）</div>` : '';
  const warn3 = easyTotal === 0 ? `<div class="warn">イージーのカードが1枚もありません。これでは場にキャラを出せません。</div>` : '';

  app.innerHTML = `
    <div class="table builder">
      <h2 class="builder-title">${playerLabel}のデッキ編成</h2>
      <div class="builder-summary ${exact?'summary-ok':'warn'}">合計 ${total} / ${DECK_SIZE} 枚${exact ? '（ちょうどです！）' : `（あと${DECK_SIZE-total}枚必要）`}</div>
      <div class="builder-save-note">※ここまでの編成内容は自動保存されます（更新しても失われません）</div>
      ${warn2}
      ${warn3}

      <div class="builder-section-title">キャラクターカード（easyは4枚まで、normal／hard／lunaticは各3枚まで）</div>
      ${renderCharacterSection()}

      <div class="builder-section-title">エネルギー（枚数制限なし）</div>
      <div class="character-card-grid">
        ${renderBuilderCard('#9c8a5c', '霊力エネルギー', 'エネルギー',
          `<div class="character-select-desc-row">わざの消費エネルギーとして使う。メイン・ベンチどちらにもドラッグで自由に付けられる</div>`,
          `<div class="builder-card-controls single-stepper-wrap">
            <span class="character-select-stage-label">枚数（制限なし）</span>
            <div class="stepper energy-stepper">
              <button data-energy-delta="-10" ${sel.energy<=0?'disabled':''}>−10</button>
              <button data-energy-delta="-1" ${sel.energy<=0?'disabled':''}>−1</button>
              <span>${sel.energy}</span>
              <button data-energy-delta="1" ${total>=DECK_SIZE?'disabled':''}>＋1</button>
              <button data-energy-delta="10" ${total>=DECK_SIZE?'disabled':''}>＋10</button>
            </div>
          </div>`,
          `<div class="character-select-hp energy-orb-display"><span class="orb"></span></div>`
        )}
        ${renderBuilderCard('#7c8a9c', '交代エネルギー', 'エネルギー',
          `<div class="character-select-desc-row">メインとベンチを入れ替える（交代する）ために必要。メインにドラッグで付けておくと、そのキャラが交代できるようになる</div>`,
          `<div class="builder-card-controls single-stepper-wrap">
            <span class="character-select-stage-label">枚数（制限なし）</span>
            <div class="stepper energy-stepper">
              <button data-retreat-energy-delta="-10" ${(sel.retreatEnergy||0)<=0?'disabled':''}>−10</button>
              <button data-retreat-energy-delta="-1" ${(sel.retreatEnergy||0)<=0?'disabled':''}>−1</button>
              <span>${sel.retreatEnergy||0}</span>
              <button data-retreat-energy-delta="1" ${total>=DECK_SIZE?'disabled':''}>＋1</button>
              <button data-retreat-energy-delta="10" ${total>=DECK_SIZE?'disabled':''}>＋10</button>
            </div>
          </div>`,
          `<div class="character-select-hp energy-orb-display">🟣</div>`
        )}
      </div>

      <div class="builder-section-title">持ち物カード（各0〜4枚）</div>
      <div class="character-card-grid">${itemCards}</div>

      <div class="builder-section-title">特殊カード（各0〜5枚・1ターンに1枚まで使用可）</div>
      <div class="character-card-grid">${specialCards}</div>

      <div class="builder-section-title">サポートカード（各0〜5枚・1ターンに何枚でも使用可）</div>
      <div class="character-card-grid">${supportCards}</div>

      <div class="controls" style="margin-top:14px;">
        <button id="autoFillBtn">おまかせで組む</button>
        <button id="confirmDeckBtn" class="attack" ${exact?'':'disabled'}>このデッキで決定</button>
        <button id="openDeckSlotsBtn" class="manual-btn">デッキ保存</button>
        <button id="openDiagnosisBtn" class="manual-btn">デッキ診断</button>
        <button id="openManualBtn" class="manual-btn">説明書</button>
        <button id="backToMenuFromBuilder" class="resign">モード選択に戻る</button>
      </div>
    </div>
    ${renderFilterModal()}
    ${renderManualModal()}
    ${renderDiagnosisModal()}
    ${renderDeckSlotsModal()}`;

  const restoreBuilderScroll = () => {
    window.scrollTo(0, prevDocumentScrollY);
    document.documentElement.scrollTop = prevDocumentScrollY;
    document.body.scrollTop = prevDocumentScrollY;
    const newFilterModal = document.querySelector('.filter-modal-box');
    if(newFilterModal) newFilterModal.scrollTop = prevFilterModalScroll;
  };
  restoreBuilderScroll();
  requestAnimationFrame(restoreBuilderScroll);
  setTimeout(restoreBuilderScroll, 0);
  const newItemList = document.getElementById('itemDeckList');
  if(newItemList) newItemList.scrollTop = prevItemScroll;

  saveBuilderDraft();
}

function passiveLabel(card){
  const p = card.passive;
  if(!p) return '';
  if(p.type === 'statusImmune') return '特性：場にいる間、状態異常（やけど・凍結・道連れの呪い）にならない';
  if(p.type === 'selfHealPerTurn') return `特性：場にいる間、毎ターンHPを${p.amount}回復`;
  if(p.type === 'hpBonusIfAllyPresent'){
    const ally = CHAR_DB.find(c=>c.id===p.allyId);
    return `特性：場に${ally?ally.name:p.allyId}がいる間、最大HP+${p.amount}`;
  }
  if(p.type === 'atkBonusIfAllyPresent'){
    const ally = CHAR_DB.find(c=>c.id===p.allyId);
    return `特性：場に${ally?ally.name:p.allyId}がいる間、攻撃力+${p.amount}`;
  }
  if(p.type === 'chanceAttachEnergyIfMain') return `特性：メインにいる時、自分のターンに${Math.round(p.chance*100)}%の確率で霊力エネルギーを自身に付ける`;
  if(p.type === 'chanceDrawIfMain') return `特性：メインにいる時、自分のターンに${Math.round(p.chance*100)}%の確率で山札から1枚引く`;
  if(p.type === 'statusImmuneType') return `特性：${p.statusType==='burn'?'やけど':'凍結'}状態にならない`;
  if(p.type === 'chanceBonusDamageFraction') return `特性：ダメージを与える際、${Math.round(p.chance*100)}%の確率で与えたダメージの${Math.round(1/p.fraction)}分の1をプラスで与える`;
  if(p.type === 'selfDamagePerTurn') return `特性：メインにいる時、自分のターンが終わると自分に${p.amount}ダメージ`;
  if(p.type === 'damageReductionFraction') return `特性：場にいる間、受けるダメージが${Math.round(p.fraction*100)}%になる（状態異常のダメージを除く）`;
  if(p.type === 'finisherLowHp') return `特性：メインにいるとき、相手の体力が${p.threshold}以下なら、その相手に${p.amount}ダメージ（ベンチも対象）`;
  return '';
}

function effectLabel(effects){
  if(!effects || !effects.length) return '';
  const labels = effects.map(ef=>{
    switch(ef.type){
      case 'bonusVsType': return `／${ef.targetType}に+${ef.amount}`;
      case 'benchBonusVsType': return `／敵ベンチの${ef.targetType}に${ef.amount}`;
      case 'flatBonusDamage': return `／敵ベンチに${ef.amount}ダメージ`;
      case 'selfBenchDamage': return `／自分のベンチ全体に${ef.amount}ダメージ`;
      case 'secondaryBenchDamageRandom': return `／敵ベンチのランダムな1体に${ef.amount}ダメージ`;
      case 'drawCardsEqualToKnockouts': return `／自分の撃破数と同じ枚数のカードを引く`;
      case 'selfGiveEnergy': return `／自分に霊力エネルギー${ef.amount}枚付与`;
      case 'selfGiveRetreatEnergy': return `／自分に交代エネルギー${ef.amount}枚付与`;
      case 'bonusIfOpponentHigherHp': return `／相手の体力が自分より多いなら+${ef.amount}`;
      case 'bonusIfOpponentHpAtLeast': return `／相手の体力が${ef.threshold}以上なら+${ef.amount}`;
      case 'benchDamage': return `／敵ベンチ全員に${ef.amount}`;
      case 'selfStatus': return `／自分に${ef.status==='regen'?'再生':ef.status==='shield'?'結界':ef.status==='curse'?'道連れの呪い':ef.status}付与`;
      case 'inflictStatus': return `／相手に${ef.status==='random'?'ランダム状態異常':(ef.status==='burn'?'やけど':'凍結')}付与`;
      case 'recoil': return `／自分に${ef.amount}反動`;
      case 'shield': return `／結界(被弾-${ef.amount})付与`;
      case 'healBench': return `／ベンチに${ef.amount}回復`;
      case 'halfDamageNext': return `／自分は次に受けるダメージが半分になる`;
      case 'benchGiveEnergy': return `／ベンチ${ef.count||1}体に霊力エネルギー${ef.amount||1}付与`;
      case 'benchGiveRetreatEnergy': return `／ベンチ${ef.count||1}体に交代エネルギー${ef.amount||1}付与`;
      case 'addElement': return `／${ef.element}属性追加`;
      case 'randomElement': return `／属性ランダム(${(ef.pool||[]).join('/')})`;
      case 'ignoreWeakness': return `／弱点無視`;
      case 'bonusIfStatus': return `／相手が${ef.statusType==='shield'?'結界':ef.statusType}状態なら+${ef.amount}`;
      case 'multiHitRandom': return `／${ef.dmgPerHit}ダメージをランダムな相手に${ef.hits}回攻撃(弱点無視)`;
      case 'multiHitBenchRandom': return `／敵ベンチにランダムに${ef.hits}回攻撃`;
      case 'fixedMultiHitMain': return `／敵メインに${ef.hits}回攻撃`;
      case 'healBenchAll': return `／自分のベンチ全員に${ef.amount}回復`;
      case 'weaknessMatchElement': return `／相手の弱点属性に合わせて発動`;
      case 'drawCard': return `／山札から${ef.amount}枚引く`;
      case 'drawOnKO': return `／撃破時に${ef.amount}枚引く`;
      case 'selfDamageOnKO': return `／撃破時に自分に${ef.amount}反動`;
      case 'selfSwapAfter': return `／攻撃後ベンチと入れ替わる`;
      case 'forcedSwapThenStatus': return `／攻撃後、相手を強制交代させ${ef.status==='burn'?'やけど':ef.status}を付与`;
      case 'returnHandToDeck': return `／相手の手札1枚をランダムに山札へ戻す`;
      case 'preventRetreat': return `／相手を${ef.turns}ターン交代不可に`;
      case 'revealHandCards': return `／相手の手札を${ef.count}枚ランダムに見る`;
      case 'discardRandomHandCard': return `／相手の手札${ef.amount||1}枚をランダムに捨てさせる`;
      case 'bonusIfFullHp': return `／相手がHP満タンなら+${ef.amount}`;
      case 'bonusIfSelfFullHp': return `／自分のHPが満タンなら+${ef.amount}`;
      case 'becomeTypeIfWeak': return `／相手が${ef.targetSpecies}弱点なら自分を${ef.targetSpecies}として攻撃`;
      case 'benchBonusVsWeakness': return `／弱点${ef.targetWeakness}のベンチに${ef.amount}`;
      case 'reverseWeakness': return `／相手は${ef.turns}ターンの間、無属性以外すべてが弱点に`;
      case 'randomBenchOrMain': return `／${Math.round(ef.chance*100)}%でベンチに命中`;
      default: return '';
    }
  });
  return labels.join('');
}

function renderAttackList(instance, opponentPlayer, clickable){
  const opponentMain = opponentPlayer.main;
  const opponentHasBench = opponentPlayer.bench.some(b=>b);
  return `<div class="ac-moves">${instance.card.moves.map((mv,mi)=>{
    const effects = mv.effects || [];
    const isMultiHit = effects.some(ef=>ef.type === 'multiHitRandom');
    const isBenchMultiHit = effects.some(ef=>ef.type === 'multiHitBenchRandom');
    const isFixedMultiHit = effects.some(ef=>ef.type === 'fixedMultiHitMain');
    const isTargetBench = !!mv.targetBench;
    const hasAnyTarget = (isMultiHit || isFixedMultiHit) ? !!opponentMain
                        : isBenchMultiHit ? opponentHasBench
                        : isTargetBench ? opponentHasBench
                        : !!opponentMain;
    const disabled = !clickable || instance.energy < mv.cost || !hasAnyTarget;
    const cost = mv.cost === 0 ? '○' : '●'.repeat(mv.cost);
    const costLabel = mv.cost === 0 ? '消費なし' : `消費${mv.cost}`;
    const eff = effectLabel(effects) + (isTargetBench ? '／ベンチ攻撃' : '');
    let dmgDisplay = '?';
    let multTag = '';
    if(isMultiHit){
      const mh = effects.find(ef=>ef.type === 'multiHitRandom');
      const perHit = mh.dmgPerHit + stageIdx(instance) * (mh.scalePerStage||0);
      dmgDisplay = `${perHit}×${mh.hits}（合計${perHit*mh.hits}）`;
    } else if(isBenchMultiHit){
      const mh = effects.find(ef=>ef.type === 'multiHitBenchRandom');
      const perHit = mh.dmgPerHit + stageIdx(instance) * (mh.scalePerStage||0);
      dmgDisplay = `${perHit}×${mh.hits}（合計${perHit*mh.hits}）`;
    } else if(isFixedMultiHit && opponentMain){
      const mh = effects.find(ef=>ef.type === 'fixedMultiHitMain');
      const { dmg } = computeDamage(instance, opponentMain, mi, mv.element, true);
      dmgDisplay = `${dmg}×${mh.hits}（合計${dmg*mh.hits}）`;
    } else if(isTargetBench){
      const sampleBench = opponentPlayer.bench.find(b=>b);
      if(sampleBench){
        const { dmg } = computeDamage(instance, sampleBench, mi, mv.element, false);
        dmgDisplay = dmg;
      } else {
        dmgDisplay = mv.dmg + '+';
      }
    } else if(opponentMain){
      const previewElement = estimateEffectiveElement(mv, effects, opponentMain);
      const { dmg, weaknessBonus } = computeDamage(instance, opponentMain, mi, previewElement);
      dmgDisplay = dmg;
      multTag = weaknessBonus > 0 ? ` <span class="mult-tag">弱点+${weaknessBonus}</span>` : '';
    }
    return `<button class="move-row" ${disabled?'disabled':''} data-move-index="${mi}">
      <span class="move-cost">${cost}</span>
      <span class="move-name">${mv.name}<small>（${mv.element}属性・${costLabel}${eff}）</small></span>
      <span class="move-dmg">${dmgDisplay}${multTag}</span>
    </button>`;
  }).join('')}</div>`;
}

function statusLabel(instance){
  if(!instance.status) return '';
  const map = { burn:['やけど','burn'], freeze:['凍結','freeze'], regen:['再生','regen'], shield:['結界','shield'], curse:['道連れ','curse'] };
  const info = map[instance.status.type];
  if(!info) return '';
  return `<span class="status-tag ${info[1]}">${info[0]}(${instance.status.turnsLeft})</span>`;
}

function stageBadge(instance){
  const idx = stageIdx(instance);
  if(idx <= 0) return '';
  return `<span class="stage-badge stage-${instance.stage}">${STAGE_LABEL[instance.stage]}</span>`;
}

  const passiveLine = a.card.passive ? `<div class="ac-passive">✨ ${passiveLabel(a.card)}</div>` : '';

  const statusIcon = instance.status ? (instance.status.type==='burn'?' 🔥':instance.status.type==='freeze'?' ❄️':instance.status.type==='regen'?' 💚':instance.status.type==='curse'?' 💀':' 🛡️') : '';

  const promoAttr = promotionTargetable ? `data-promotion-index="${slotIndex}"` : '';
  const gapAttr = gapSwapTargetable ? `data-gap-swap-index="${slotIndex}"` : '';
  const benchBuffAttr = benchBuffTargetable ? `data-benchbuff-index="${slotIndex}"` : '';

function renderHandCard(card, index, interactive, selected){

function render(){
  const app = document.getElementById('app');
  const selfIdx = getSelfIdx();
  const otherIdx = 1 - selfIdx;
  const selfPlayer = state.players[selfIdx];
  const otherPlayer = state.players[otherIdx];
  const humanActive = isHumanTurnNow();
  const forcedPending = state.forcedSwapPending;
  const promoPending = state.promotionPending;
  const gapPending = state.gapSwapPending;
  const choicePending = state.cardChoicePending;
  const evolvePending = state.evolveChoicePending;
  const benchBuffPending = state.benchBuffPending;
  const selfInteractable = (selfIdx === state.turn) && !state.gameOver && !forcedPending && !promoPending && !gapPending && !choicePending && !evolvePending && !benchBuffPending && state.pendingMoveIndex === null;
  const attackClickable = selfInteractable && !!otherPlayer.main;
  const hasSelection = state.selectedHandIndex !== null;
  const selectedCard = hasSelection ? selfPlayer.hand[state.selectedHandIndex] : null;
  const enemyTargetMode = !!(selectedCard && selectedCard.effectType === 'energyMinus');
  const ownTargetMode = hasSelection && !enemyTargetMode;
  const moveTargetingBench = state.pendingMoveIndex !== null;
  const enemyBenchTargetMode = enemyTargetMode || moveTargetingBench;

  const forcedSwapSelf = forcedPending && forcedPending.playerIdx === selfIdx;
  const forcedSwapOther = forcedPending && forcedPending.playerIdx === otherIdx;
  const promoSelf = promoPending && promoPending.playerIdx === selfIdx;
  const promoOther = promoPending && promoPending.playerIdx === otherIdx;
  // スキマ：カード使用者から見て「相手」のベンチが対象になる
  const gapTargetIsOther = gapPending && gapPending.playerIdx === selfIdx;
  const gapTargetIsSelf = gapPending && gapPending.playerIdx === otherIdx;
  const benchBuffSelf = benchBuffPending && benchBuffPending.playerIdx === selfIdx;
  const benchBuffOther = benchBuffPending && benchBuffPending.playerIdx === otherIdx;

  const handHtml = selfPlayer.hand.map((c,i)=>renderHandCard(c,i,humanActive && !forcedPending && !moveTargetingBench && !promoPending && !gapPending && !choicePending && !evolvePending && !benchBuffPending,i===state.selectedHandIndex)).join('');
  const benchOtherHtml = otherPlayer.bench.map((b,i)=>renderBenchSlot(b,false,null,false,otherIdx,i,enemyBenchTargetMode && !!b,forcedSwapOther && !!b,promoOther && !!b,gapTargetIsOther && !!b && b.hp < getMaxHp(b),benchBuffOther && !!b && !benchBuffPending.chosen.includes(i))).join('');
  const benchSelfHtml = selfPlayer.bench.map((b,i)=>renderBenchSlot(b,selfInteractable,i,ownTargetMode && !!b,selfIdx,i,false,forcedSwapSelf && !!b,promoSelf && !!b,gapTargetIsSelf && !!b && b.hp < getMaxHp(b),benchBuffSelf && !!b && !benchBuffPending.chosen.includes(i))).join('');



  let pendingMessage = '';

    pendingMessage = `<div class="select-hint">進化させるキャラを選んでください。</div>`;

    pendingMessage = `<div class="select-hint">${state.players[choicePending.playerIdx].name}はカードを1枚選んでください。</div>`;

    const remain = benchBuffPending.count - benchBuffPending.chosen.length;
    pendingMessage = `<div class="select-hint">${state.players[benchBuffPending.playerIdx].name}は対象のベンチをあと${remain}体選んでください。</div>`;
  } else if(gapPending){
    pendingMessage = `<div class="select-hint">${state.players[gapPending.playerIdx].name}は入れ替える相手ベンチのキャラ（ダメージを受けているキャラのみ）を選んでください。</div>`;
  } else if(promoPending){
    pendingMessage = `<div class="select-hint">${state.players[promoPending.playerIdx].name}はベンチから繰り上げるキャラを選んでください。</div>`;
  } else if(forcedPending){
    pendingMessage = `<div class="select-hint">${state.players[forcedPending.playerIdx].name}はメインと入れ替えるベンチのキャラを選んでください。</div>`;
  } else if(moveTargetingBench){
    pendingMessage = `<div class="select-hint">相手のベンチの対象をタップしてください</div>`;
  } else if(hasSelection){
    pendingMessage = `<div class="select-hint">${enemyTargetMode ? '相手の対象（メイン／ベンチ）をタップしてください' : '対象（メイン／ベンチ）をタップして付けてください'}</div>`;
  }

  const choiceModalHtml = choicePending ? `
    <div class="builder-modal card-choice-modal">
      <div class="builder-modal-box card-choice-box">
        <div class="builder-modal-header"><h3>${choicePending.options.length}枚から1枚選んでください</h3></div>
        <div class="character-card-grid">
          ${choicePending.options.map((c,i)=>{
            const isChar = !c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport;
            if(!isChar){
              const label = c.isEnergy ? '霊力エネルギー' : c.isRetreatEnergy ? '交代エネルギー' : c.name;
