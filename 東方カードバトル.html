<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻想結界カード対戦 - Touhou TCG Prototype</title>
<style>
  :root{
    --bg-night:#12162a;
    --bg-night2:#1b2140;
    --paper:#f4ecd8;
    --paper-shadow:#d9cba8;
    --ink:#2b2320;
    --vermilion:#c0392b;
    --vermilion-dark:#8f2a20;
    --gold:#d9b64e;
    --gold-soft:#efd98f;
    --mist:#8892c9;

    --t-human:#3f6fb0;
    --t-youkai:#7c3fa0;
    --t-vampire:#a5263a;
    --t-oni:#c9722a;
    --t-ghost:#2f8f7f;
    --t-fairy:#c9a627;
    --t-kami:#e0b23c;
    --t-lunarian:#8f9fd6;
    --t-mage:#7e57c2;
    --t-sennin:#5a8f5a;
    --t-other:#7a6a5a;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2f5c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-night) 0%, var(--bg-night2) 100%);
    color:var(--paper);
    padding:16px;
  }

  h1{
    text-align:center;
    font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    font-weight:600;
    letter-spacing:.12em;
    font-size:clamp(20px,4vw,30px);
    margin:4px 0 2px;
    color:var(--gold-soft);
    text-shadow:0 0 18px rgba(217,182,78,.35);
  }
  .subtitle{
    text-align:center;
    font-size:12px;
    color:var(--mist);
    margin-bottom:16px;
    letter-spacing:.05em;
  }

  #app{ max-width:1180px; margin:0 auto; }

  .table{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    border:1px solid rgba(217,182,78,.25);
    border-radius:18px;
    padding:16px;
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:16px;
    align-items:start;
  }
  .table.log-hidden{ grid-template-columns: 1fr; }
  .table.builder, .table.menu-screen{ display:block; }
  .board{ display:flex; flex-direction:column; min-width:0; }

  @media (max-width:960px){
    .table{ grid-template-columns: 1fr; }
    .log-panel{ max-height:160px; min-height:0; }
  }

  .side{ display:flex; gap:10px; align-items:flex-start; margin-bottom:4px; }
  .deck-info{
    font-size:12px;
    color:var(--mist);
    white-space:nowrap;
    min-width:96px;
  }
  .ko-count{ margin-top:4px; color:var(--gold-soft); font-weight:700; }
  .board-row{ flex:1; display:flex; gap:10px; flex-wrap:wrap; min-width:0; }

  .barrier{
    display:flex;
    align-items:center;
    text-align:center;
    margin:10px 0;
    color:var(--gold);
    font-family:"Shippori Mincho","Yu Mincho",serif;
    font-size:12px;
    letter-spacing:.5em;
  }
  .barrier::before, .barrier::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.6;
  }
  .barrier span{ padding:0 10px; }

  /* ---- Main slot ---- */
  .slot{
    min-height:118px;
    border:1px dashed rgba(217,182,78,.35);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--mist);
    font-size:13px;
    padding:8px;
    text-align:center;
  }
  .main-slot{ flex:0 0 215px; }
  .table.log-hidden .main-slot{ flex:0 0 290px; }

  .active-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:12px;
    padding:9px 10px;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px var(--paper-shadow);
    --type-color:#888;
    position:relative;
    overflow:hidden;
  }
  .active-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background:var(--type-color);
  }
  .active-card.targetable{ outline:3px solid var(--gold); box-shadow:0 0 14px rgba(217,182,78,.8); cursor:pointer; }
  .ac-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:3px;}
  .ac-name{ font-family:"Shippori Mincho","Yu Mincho",serif; font-weight:700; font-size:13px; }
  .ac-type{
    font-size:9px; padding:1px 6px; border-radius:999px;
    background:var(--type-color); color:#fff; letter-spacing:.05em; white-space:nowrap;
  }
  .ac-meta{ font-size:10px; color:#6b5d4a; margin-top:2px; display:flex; justify-content:space-between; align-items:center; gap:5px;}
  .status-tag{ font-size:9px; padding:2px 6px; border-radius:999px; color:#fff; white-space:nowrap; font-weight:700;}
  .status-tag.burn{ background:#c0392b; }
  .status-tag.freeze{ background:#3a8fd1; }
  .status-tag.regen{ background:#4a9e5c; }
  .status-tag.shield{ background:#8a7a3f; }
  .status-tag.curse{ background:#4a2a5a; }
  .stage-badge{
    font-size:8px; padding:1px 5px; border-radius:999px; margin-left:5px;
    color:#fff; font-weight:700; vertical-align:middle; white-space:nowrap;
  }
  .stage-badge.stage-normal{ background:#3a8fd1; }
  .stage-badge.stage-hard{ background:#c9722a; }
  .stage-badge.stage-lunatic{ background:#c0392b; }
  .hp-bar-wrap{ margin-top:5px; height:7px; border-radius:5px; background:#d9cba8; overflow:hidden;}
  .hp-bar-wrap.mini{ height:5px; margin-top:3px;}
  .hp-bar{ height:100%; background:linear-gradient(90deg,#7fae5c,#a9cf7c); transition:width .3s ease;}
  .hp-bar.low{ background:linear-gradient(90deg,#c0392b,#e0685a); }
  .ac-energy{ margin-top:5px; display:flex; gap:3px; align-items:center; font-size:9px; color:#6b5d4a;}
  .orb{ width:10px; height:10px; border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--gold-soft), var(--gold) 70%); box-shadow:0 0 4px rgba(217,182,78,.7);}
  .orb.empty{ background:#e2d7bd; box-shadow:none; }
  .ac-item{ margin-top:4px; font-size:9px; color:#5a4a2f; background:rgba(0,0,0,.06); border-radius:5px; padding:2px 5px; display:inline-block;}
  .weak-tag{ font-size:9px; color:var(--vermilion-dark); margin-top:4px;}
  .ac-passive{ font-size:8px; color:#7a4fa0; margin-top:3px; font-weight:600; }

  .ac-moves{ margin-top:6px; display:flex; flex-direction:column; gap:3px; }
  .move-row{
    display:flex; align-items:center; gap:8px; width:100%;
    background:rgba(0,0,0,.06); border:1px solid rgba(0,0,0,.12); border-radius:7px;
    padding:4px 7px; font-family:inherit; font-size:10px; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .move-row:not(:disabled):hover{ background:rgba(192,57,43,.12); border-color:var(--vermilion); }
  .move-row:disabled{ opacity:.4; cursor:not-allowed; }
  .move-cost{ color:var(--gold-soft); background:#4a3f30; border-radius:4px; padding:1px 4px; font-size:9px; min-width:16px; text-align:center; letter-spacing:-1px;}
  .move-name{ flex:1; font-weight:600; }
  .move-name small{ font-weight:400; color:#6b5d4a; }
  .move-dmg{ font-weight:800; font-size:12px; }
  .mult-tag{ color:var(--vermilion-dark); font-weight:800; }

  /* ---- bench ---- */
  .bench-row{ display:flex; gap:6px; flex:1; flex-wrap:wrap; align-items:flex-start; min-width:140px; }
  .bench-card{
    width:135px; background:var(--paper); color:var(--ink); border-radius:8px;
    padding:5px 7px; font-size:9px; border-top:4px solid var(--type-color,#888);
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .table.log-hidden .bench-card{ width:180px; }
  .bench-card.empty{
    display:flex; align-items:center; justify-content:center; min-height:66px;
    background:rgba(255,255,255,.04); color:var(--mist);
    border:1px dashed rgba(217,182,78,.3); box-shadow:none;
  }
  .bench-card.swappable{ cursor:pointer; }
  .bench-card.swappable:hover{ outline:2px solid var(--vermilion); }
  .bench-card.targetable{ outline:3px solid var(--gold); box-shadow:0 0 12px rgba(217,182,78,.8); }
  .bc-name{ font-weight:700; font-family:"Shippori Mincho","Yu Mincho",serif; font-size:11px; display:flex; justify-content:space-between; align-items:baseline; gap:4px;}
  .bc-type{ font-size:8px; color:#6b5d4a; font-weight:400; white-space:nowrap;}
  .bc-hp{ margin-top:2px; color:#4a3f30;}
  .bc-energy{ margin-top:2px; color:#6b5d4a;}
  .bc-weak{ margin-top:2px; color:var(--vermilion-dark);}
  .bc-passive{ margin-top:2px; color:#7a4fa0; font-weight:600; }
  .bc-moves{ margin-top:3px; color:#6b5d4a; font-size:9px; line-height:1.4;}
  .bc-item{ margin-top:3px; font-size:9px; color:#6b5d4a;}

  /* ---- log ---- */
  .log-panel{
    background:rgba(0,0,0,.28);
    border-radius:10px;
    padding:8px 12px;
    font-size:12px;
    line-height:1.6;
    max-height:640px;
    min-height:300px;
    overflow-y:auto;
    color:#d9d4e8;
    border:1px solid rgba(255,255,255,.06);
  }
  .log-title{
    font-family:"Shippori Mincho","Yu Mincho",serif;
    color:var(--gold-soft);
    font-size:12px;
    letter-spacing:.1em;
    margin-bottom:6px;
    border-bottom:1px solid rgba(217,182,78,.25);
    padding-bottom:4px;
  }
  .log-name{ color:var(--gold-soft); font-weight:700; }
  .log-dmg{ color:#ff8a76; font-weight:800; }
  .log-heal{ color:#7fe0a0; font-weight:800; }
  .log-reduce{ color:#8fc9ff; font-weight:800; }

  .result-modal{
    display:none;
    position:fixed; inset:0; z-index:1001;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.75);
  }
  .result-box{
    background:var(--paper); color:var(--ink); border-radius:16px;
    padding:32px 44px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .result-banner{
    font-family:"Shippori Mincho","Yu Mincho",serif;
    font-size:clamp(36px,7vw,56px);
    font-weight:800; letter-spacing:.06em;
  }
  .result-box.win .result-banner{ color:#2a7a3f; text-shadow:0 0 20px rgba(60,180,90,.4); }
  .result-box.lose .result-banner{ color:var(--vermilion); text-shadow:0 0 20px rgba(192,57,43,.4); }
  .result-sub{ margin-top:10px; font-size:14px; color:#4a3f30; }
  .result-box .controls{ margin-top:18px; }

  /* ---- hand ---- */
  .opponent-hand-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:5px 2px 8px;
    justify-content:flex-start;
  }
  .opponent-hand-back{
    flex:0 0 58px;
    height:76px;
    border-radius:8px;
    border:1px solid rgba(217,182,78,.35);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 4px, rgba(0,0,0,.08) 4px 8px),
      #292d4e;
    box-shadow:0 3px 8px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(239,217,143,.55);
    font-size:18px;
    user-select:none;
  }
  .opponent-hand-back.revealed{
    background:var(--paper);
    color:var(--ink);
    font-size:10px;
    font-weight:700;
    line-height:1.25;
    padding:4px;
    text-align:center;
    word-break:break-word;
    border:1px solid rgba(192,57,43,.5);
    box-shadow:0 0 8px rgba(192,57,43,.5), 0 3px 8px rgba(0,0,0,.28);
  }
  .opponent-hand-label{
    color:var(--mist);
    font-size:10px;
    margin-right:4px;
    white-space:nowrap;
  }

  .hand-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 2px 4px;
  }
  .hcard{
    flex:0 0 auto;
    width:82px;
    min-height:108px;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:7px 6px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    border-top:4px solid var(--type-color, var(--gold));
    transition:transform .15s ease;
    font-size:10px;
  }
  .hcard:hover{ transform:translateY(-4px); }
  .hcard.dim{ opacity:.5; cursor:default; }
  .hcard.dim:hover{ transform:none; }
  .hcard.selected{ outline:3px solid var(--vermilion); transform:translateY(-4px); }
  .hcard .hname{ font-weight:700; font-size:12px; line-height:1.3; font-family:"Shippori Mincho","Yu Mincho",serif;}
  .hcard .htype{ margin-top:3px; color:#6b5d4a; }
  .hcard .hhp{ margin-top:4px; color:#4a3f30;}
  .hcard.energy{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .hcard.energy .orb{ width:22px; height:22px; margin-bottom:6px;}
  .hcard.energy .retreat-orb{ font-size:20px; line-height:1; margin-bottom:6px;}

  /* ---- controls ---- */
  .controls{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
  button{
    font-family:inherit;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    cursor:pointer;
    background:var(--gold);
    color:#2b2110;
    font-weight:700;
    letter-spacing:.03em;
    transition:filter .15s ease, transform .15s ease;
  }
  button:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  button:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  button.attack{ background:var(--vermilion); color:#fff; }
  button.resign{ background:#3a3f6b; color:#f0ecff; }

  .gameover{
    margin-top:14px;
    text-align:center;
    font-family:"Shippori Mincho","Yu Mincho",serif;
    font-size:20px;
    color:var(--gold-soft);
  }
  .banner-text{
    font-size:clamp(28px,6vw,44px);
    letter-spacing:.15em;
    color:var(--gold-soft);
    text-shadow:0 0 20px rgba(217,182,78,.6);
    margin-bottom:6px;
  }
  .banner-text.lose{ color:var(--vermilion); text-shadow:0 0 20px rgba(192,57,43,.6); }
  .gameover button{ margin-top:10px; }

  .hint{ text-align:center; font-size:11px; color:var(--mist); margin-top:6px; }
  .thinking{ color:var(--gold-soft); font-size:12px; text-align:center; margin-top:8px; }
  .select-hint{ text-align:center; font-size:12px; color:var(--gold-soft); margin-top:6px; }

  /* ---- menu / builder ---- */
  .menu-screen{ text-align:center; padding:30px 10px; }
  .menu-screen p{ color:var(--mist); font-size:13px; margin-bottom:16px; }
  .menu-screen p.small{ font-size:11px; margin-bottom:6px; }
  .menu-screen .online-error{ color:#e0685a; font-size:12px; margin-bottom:10px; }

  /* ---- online lobby ---- */
  .room-code{
    font-family:monospace; font-size:26px; letter-spacing:4px; font-weight:700;
    color:var(--gold-soft); background:rgba(255,255,255,.06); border:1px dashed var(--gold);
    border-radius:8px; padding:12px 10px; margin:0 auto 14px; max-width:260px;
  }
  .room-code-copy{ font-size:11px; margin-top:-8px; margin-bottom:14px; }
  .join-code-input{
    width:200px; text-align:center; font-family:monospace; font-size:18px; letter-spacing:3px;
    text-transform:uppercase; padding:8px 6px; border-radius:6px; border:1px solid var(--gold-soft);
    background:rgba(255,255,255,.06); color:var(--paper); margin-bottom:14px;
  }
  .online-badge{
    display:inline-block; font-size:10px; color:var(--gold-soft); border:1px solid rgba(217,182,78,.5);
    border-radius:10px; padding:1px 8px; margin-left:6px; vertical-align:middle;
  }
  .online-disconnect-banner{
    text-align:center; font-size:12px; color:#e0685a; background:rgba(224,104,90,.12);
    border:1px solid rgba(224,104,90,.5); border-radius:6px; padding:6px; margin-top:8px;
  }
  .spinner-dots::after{ content:'…'; animation:dotpulse 1.2s steps(4,end) infinite; }
  @keyframes dotpulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .builder-title{ font-family:"Shippori Mincho","Yu Mincho",serif; color:var(--gold-soft); font-size:18px; margin:4px 0 8px; text-align:center;}
  .builder-summary{ text-align:center; font-size:13px; color:var(--mist); margin-bottom:4px; font-weight:700;}
  .builder-summary.summary-ok{ color:#7fd88f; }
  .builder-summary.warn{ color:#e0685a; }
  .warn{ text-align:center; font-size:12px; color:#e0685a; margin-bottom:4px;}
  .builder-section-title{
    font-family:"Shippori Mincho","Yu Mincho",serif; color:var(--gold); font-size:13px;
    margin:14px 0 6px; border-bottom:1px solid rgba(217,182,78,.25); padding-bottom:3px;
  }
  .deck-list{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; padding-right:4px;}
  .deck-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,.04); border-left:4px solid var(--type-color, var(--gold));
    border-radius:6px; padding:6px 10px;
  }
  .dr-info b{ font-size:13px; }
  .dr-sub{ display:block; font-size:10px; color:var(--mist); margin-top:2px;}
  .stepper{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .stepper button{ padding:4px 10px; font-size:14px; }
  .stepper span{ min-width:16px; text-align:center; font-weight:700;}
  .char-row{ flex-direction:column; align-items:stretch; gap:8px; }
  .stage-stepper-group{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; }
  .stage-stepper{ display:flex; flex-direction:column; align-items:center; gap:3px; background:rgba(0,0,0,.15); border-radius:6px; padding:5px 8px;}
  .stage-stepper-label{ font-size:9px; color:var(--mist); }
  .stage-stepper .stepper button{ padding:2px 8px; font-size:12px; }

  .character-selection-summary{
    text-align:center;
    color:var(--gold-soft);
    font-size:12px;
    margin:6px 0;
  }
  .energy-stepper{ gap:5px; }
  .energy-stepper button{ min-width:44px; padding:4px 7px; font-size:12px; }

  /* ---- builder character/filter modals ---- */
  .builder-modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.78);
  }
  .builder-modal.filter-modal{ z-index:1100; }
  .builder-modal-box{
    width:min(1050px,96vw);
    max-height:90vh;
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
    padding:16px;
  }
  .char-modal-box{ display:flex; flex-direction:column; }
  .filter-modal-box{ width:min(900px,96vw); overflow-y:auto; max-height:88vh; }
  .builder-modal.card-choice-modal{ z-index:1200; }
  .card-choice-box{ width:min(560px,94vw); overflow-y:auto; max-height:80vh; }
  .builder-modal.manual-modal{ z-index:1300; }
  .manual-box{ width:min(760px,94vw); overflow-y:auto; max-height:88vh; text-align:left; }
  .manual-content h4{
    font-family:"Shippori Mincho","Yu Mincho",serif;
    color:var(--vermilion-dark);
    font-size:16px;
    margin:18px 0 6px;
    border-bottom:2px solid rgba(192,57,43,.25);
    padding-bottom:4px;
  }
  .manual-content h4:first-child{ margin-top:0; }
  .manual-content p{ margin:6px 0; font-size:13px; line-height:1.7; color:#4a3f30; }
  .manual-content ul{ margin:6px 0; padding-left:20px; font-size:13px; line-height:1.7; color:#4a3f30; }
  .manual-content li{ margin:3px 0; }
  .manual-content .manual-sub{ font-weight:700; color:#6b3020; }
  .manual-content table{ width:100%; border-collapse:collapse; margin:8px 0; font-size:12px; }
  .manual-content th, .manual-content td{ border:1px solid rgba(80,60,30,.18); padding:5px 8px; text-align:left; }
  .manual-content th{ background:rgba(192,57,43,.1); color:#6b3020; }
  .manual-btn{ background:#3a3f6b; color:#f0ecff; }
  .builder-modal.deck-slots-modal{ z-index:1300; }
  .slots-box{ width:min(560px,94vw); overflow-y:auto; max-height:80vh; text-align:left; }
  .deck-slot-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:8px; background:rgba(80,60,30,.06);
    border:1px solid rgba(80,60,30,.14); margin-bottom:8px;
  }
  .deck-slot-row.empty-slot{ opacity:.75; }
  .deck-slot-info{ display:flex; flex-direction:column; font-size:13px; }
  .deck-slot-info .dr-sub{ font-size:11px; color:#766a59; margin-top:2px; }
  .deck-slot-actions{ display:flex; gap:5px; flex-wrap:wrap; }

<body>
  <h1>幻想結界カード対戦</h1>
  <div class="subtitle">東方風・簡易TCGプロトタイプ（メイン＋ベンチ制）</div>
  <div id="app"></div>
  <div id="cardDetailOverlay" class="card-detail-overlay"></div>
  <div id="resultModal" class="result-modal"></div>

  <script src="card.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
/* =========================================================
   状態
========================================================= */
let state = null;      // 対戦中の状態
let aiActingIdx = 1;   // 現在AIが操作しているプレイヤーのインデックス（観戦モードでは0にもなる）
let builder = null;    // デッキ編成中の状態
let savedMode = null;
let manualModalOpen = false; // 説明書モーダルの表示状態（画面をまたいで共通）
let savedDecks = null; // [player0の元デッキ, player1の元デッキ]（再戦用）

/* =========================================================
   オンライン対戦（PeerJS による P2P 通信）
   ------------------------------------------------------------
   ・ホスト（部屋を作った側）が常に state を実際に計算する「唯一の権威」。
     player0 = ホスト、player1 = ゲスト、に固定する。
   ・ホストは render() のたびに state 全体を JSON 化してゲストへ送信する。
   ・ゲストは自分の操作を「関数名＋引数」のメッセージとしてホストへ送るだけで、
     ローカルの state は直接書き換えない（ホストから届いた state で丸ごと置き換える）。
   ・簡易実装のため、相手の手札の中身を隠す処理は行っていません（開発者ツール等で
     覗こうと思えば見えてしまいます）。友人同士のカジュアルプレイを想定しています。
========================================================= */
let netRole = null;        // 'host' | 'guest' | null
let myPlayerIdx = 0;       // オンライン対戦時の自分のプレイヤー番号（ホスト=0 / ゲスト=1）
let peer = null;           // PeerJSのPeerインスタンス
let conn = null;           // PeerJSのDataConnection
let onlineUI = null;       // ロビー画面（部屋作成／参加）の表示状態
let onlineHostOwnDeck = null;  // ホスト自身が組んだデッキ（相手のデッキ到着待ちの間保持）
let onlineGuestDeck = null;    // ホストが受け取ったゲストのデッキ
const ROOM_PREFIX = 'thcb-v1-';

function getSelfIdx(){
  if(!state) return 0;
  if(state.mode === 'cpu' || state.mode === 'spectator') return 0;
  if(state.mode === 'online') return myPlayerIdx;
  return state.turn; // ホットシート：常に「今の手番の人」が自分側の画面になる
}

function generateRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 紛らわしい文字(0/O, 1/I)は除外
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function cleanupPeer(){
  try{ if(conn){ conn.close(); } }catch(e){}
  try{ if(peer){ peer.destroy(); } }catch(e){}
  conn = null;
  peer = null;
  netRole = null;
  myPlayerIdx = 0;
  onlineHostOwnDeck = null;
  onlineGuestDeck = null;
}

function showOnlineMenu(){
  cleanupPeer();
  onlineUI = { phase:'menu' };
  renderOnlineUI();
}

function startHosting(){
  netRole = 'host';
  myPlayerIdx = 0;
  const code = generateRoomCode();
  onlineUI = { phase:'hosting-wait', roomCode: code };
  renderOnlineUI();
  try{
    peer = new Peer(ROOM_PREFIX + code, { debug: 0 });
  }catch(e){
    onlineUI = { phase:'error', error:'この端末ではオンライン対戦を利用できません。' };
    renderOnlineUI();
    return;
  }
  peer.on('connection', (c)=>{
    if(conn){ try{ c.close(); }catch(e){} return; } // 既に対戦相手がいる場合は追加接続を拒否
    conn = c;
    setupConnHandlers(conn);
    conn.on('open', ()=>{
      onlineUI = null;
      beginDeckBuilding('online');
    });
  });
  peer.on('error', (err)=>{
    const type = err && err.type;
    onlineUI = { phase:'error', error: type === 'unavailable-id'
      ? 'この合言葉は現在使用中です。もう一度お試しください。'
      : '通信エラーが発生しました。ネットワーク設定をご確認ください。' };
    renderOnlineUI();
  });
}

function startJoining(){
  onlineUI = { phase:'join-input', codeValue:'' };
  renderOnlineUI();
}

function connectToRoom(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  if(!code){ return; }
  netRole = 'guest';
  myPlayerIdx = 1;
  onlineUI = { phase:'joining-wait' };
  renderOnlineUI();
  try{
    peer = new Peer({ debug: 0 });
  }catch(e){
    onlineUI = { phase:'error', error:'この端末ではオンライン対戦を利用できません。' };
    renderOnlineUI();
    return;
  }
  peer.on('open', ()=>{
    conn = peer.connect(ROOM_PREFIX + code, { reliable:true });
    setupConnHandlers(conn);
    conn.on('open', ()=>{
      onlineUI = null;
      beginDeckBuilding('online');
    });
  });
  peer.on('error', (err)=>{
    const type = err && err.type;
    onlineUI = { phase:'error', error: type === 'peer-unavailable'
      ? '合言葉が見つかりません。スペルや部屋の状態を確認してください。'
      : '通信エラーが発生しました。ネットワーク設定をご確認ください。' };
    renderOnlineUI();
  });
}

function setupConnHandlers(c){
  c.on('data', (msg)=>{ try{ handlePeerMessage(msg); }catch(e){ console.error(e); } });
  c.on('close', ()=>{ handlePeerDisconnect(); });
  c.on('error', ()=>{ handlePeerDisconnect(); });
}

function handlePeerDisconnect(){
  if(onlineUI){
    onlineUI = { phase:'error', error:'対戦相手との接続が切断されました。' };
    renderOnlineUI();
    return;
  }
  if(builder && builder.mode === 'online'){
    onlineUI = { phase:'error', error:'対戦相手との接続が切断されました。' };
    builder = null;
    renderOnlineUI();
    return;
  }
  if(state && state.mode === 'online' && !state.gameOver && !state.disconnected){
    state.disconnected = true;
    log('対戦相手との接続が切断されました。');
    render();
  }
}

function handlePeerMessage(msg){
  if(!msg || !msg.t) return;
  if(msg.t === 'deck' && netRole === 'host'){
    onlineGuestDeck = msg.deck;
    if(onlineHostOwnDeck){ startOnlineGame(); }
    else if(onlineUI){ onlineUI = { phase:'deck-wait' }; renderOnlineUI(); }
    return;
  }
  if(msg.t === 'action' && netRole === 'host'){
    if(!state || state.mode !== 'online' || state.gameOver || state.disconnected) return;
    const f = REMOTE_ACTIONS[msg.fn];
    if(f) f.apply(null, msg.args || []);
    return;
  }
  if(msg.t === 'state' && netRole === 'guest'){
    const prevLogVisible = state ? state.logVisible : true;
    state = msg.state;
    if(typeof prevLogVisible === 'boolean') state.logVisible = prevLogVisible;
    onlineUI = null;
    render();
    return;
  }
}

function startOnlineGame(){
  const startingIdx = Math.random() < 0.5 ? 0 : 1;
  const hostDeck = onlineHostOwnDeck.slice();
  const guestDeck = onlineGuestDeck.slice();
  savedMode = 'online';
  savedDecks = [hostDeck, guestDeck];
  onlineUI = null;
  initGame('online', [shuffle(hostDeck.slice()), shuffle(guestDeck.slice())], startingIdx);
}

function renderOnlineUI(){
  const app = document.getElementById('app');
  if(!onlineUI){ return; }
  if(onlineUI.phase === 'menu'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p>オンライン対戦（無料・サーバー不要のP2P通信です）</p>
        <div class="controls">
          <button id="onlineHostBtn">部屋を作る（ホスト）</button>
          <button id="onlineJoinBtn">合言葉で参加する</button>
        </div>
        <div class="controls" style="margin-top:10px;">
          <button id="backToMenuFromOnline" class="resign">戻る</button>
        </div>
      </div>`;
  } else if(onlineUI.phase === 'hosting-wait'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p>この合言葉を対戦相手に伝えてください</p>
        <div class="room-code">${onlineUI.roomCode}</div>
        <p class="small spinner-dots">相手の接続を待っています</p>
        <div class="controls" style="margin-top:10px;">
          <button id="backToMenuFromOnline" class="resign">キャンセル</button>
        </div>
      </div>`;
  } else if(onlineUI.phase === 'join-input'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p>対戦相手から聞いた合言葉を入力してください</p>
        <input type="text" id="joinCodeInput" class="join-code-input" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters">
        <div class="controls">
          <button id="joinConnectBtn">接続する</button>
        </div>
        <div class="controls" style="margin-top:10px;">
          <button id="backToMenuFromOnline" class="resign">戻る</button>
        </div>
      </div>`;
    const inputEl = document.getElementById('joinCodeInput');
    if(inputEl){ inputEl.focus(); }
  } else if(onlineUI.phase === 'joining-wait'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p class="spinner-dots">接続しています</p>
      </div>`;
  } else if(onlineUI.phase === 'deck-wait'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p class="spinner-dots">対戦相手のデッキ準備を待っています</p>
      </div>`;
  } else if(onlineUI.phase === 'error'){
    app.innerHTML = `
      <div class="table menu-screen">
        <p class="online-error">${onlineUI.error || 'エラーが発生しました。'}</p>
        <div class="controls">
          <button id="backToMenuFromOnline">オンライン対戦メニューに戻る</button>
        </div>
      </div>`;
  }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* ---- 進化ステージ ---- */
const STAGE_ORDER = ['easy','normal','hard','lunatic'];
const ELEMENT_LIST = ['木','火','水','氷','岩','闇','光','星'];
const STAGE_LABEL = { easy:'イージー', normal:'ノーマル', hard:'ハード', lunatic:'ルナティック' };
function stageIdx(instance){ return STAGE_ORDER.indexOf(instance.stage || 'easy'); }
function findInstanceOwner(instance){
  if(!state || !state.players) return null;
  for(const p of state.players){
    if(p.main === instance) return p;
    if(p.bench && p.bench.includes(instance)) return p;
  }
  return null;
}
function hasAllyOnField(player, allyCharId){
  if(!player) return false;
  if(player.main && player.main.card.id === allyCharId) return true;
  return player.bench.some(b=>b && b.card.id === allyCharId);
}
function getMaxHp(instance){
  const idx = stageIdx(instance);
  // easy→normal:+10、normal→hard:+20、hard→lunatic:+30（累積）
  const evolutionHpBonus = idx * (idx + 1) * 5;
  let base = instance.card.hp + evolutionHpBonus + (instance.maxHpBonus||0);
  const passive = instance.card.passive;
  if(passive && passive.type === 'hpBonusIfAllyPresent'){
    const owner = findInstanceOwner(instance);
    if(owner && hasAllyOnField(owner, passive.allyId)) base += passive.amount;
  }
  return base;
}
function evolveInstance(instance){
  const idx = stageIdx(instance);
  if(idx >= STAGE_ORDER.length-1) return false;
  const nextStage = STAGE_ORDER[idx+1];
  const hpBonus = (idx + 1) * 10; // +10 / +20 / +30
  instance.stage = nextStage;
  instance.hp += hpBonus;
  // 攻撃力はcomputeDamage側でstageに応じて累積+5されるため、
  // インスタンスに別途加算しない。
  return true;
}

/* =========================================================
   デッキ編成
========================================================= */
function freshSelections(){
  const chars = {}; CHAR_DB.forEach(c=>{ chars[c.id] = { easy:0, normal:0, hard:0, lunatic:0 }; });
  const items = {}; ITEM_DB.forEach(it=>items[it.id]=0);
  const specials = {}; SPECIAL_DB.forEach(sp=>specials[sp.id]=0);
  const supports = {}; SUPPORT_DB.forEach(su=>supports[su.id]=0);
  return { chars, energy:0, retreatEnergy:0, items, specials, supports };
}

function compileDeckFromSelections(sel){
  const deck = [];
  CHAR_DB.forEach(c=>{
    STAGE_ORDER.forEach(stage=>{
      const n = sel.chars[c.id][stage];
      for(let i=0;i<n;i++) deck.push({...c, isEnergy:false, isRetreatEnergy:false, isItem:false, isSpecial:false, isSupport:false, cardStage:stage});
    });
  });
  for(let i=0;i<sel.energy;i++) deck.push({ id:'energy_'+i, name:'霊力エネルギー', isEnergy:true, isRetreatEnergy:false, isItem:false, isSpecial:false, isSupport:false });
  for(let i=0;i<(sel.retreatEnergy||0);i++) deck.push({ id:'retreat_energy_'+i, name:'交代エネルギー', isEnergy:false, isRetreatEnergy:true, isItem:false, isSpecial:false, isSupport:false });
  ITEM_DB.forEach(it=>{
    for(let i=0;i<sel.items[it.id];i++) deck.push({...it, isEnergy:false, isRetreatEnergy:false, isItem:true, isSpecial:false, isSupport:false});
  });
  SPECIAL_DB.forEach(sp=>{
    for(let i=0;i<sel.specials[sp.id];i++) deck.push({...sp, isEnergy:false, isRetreatEnergy:false, isItem:false, isSpecial:true, isSupport:false});
  });
  SUPPORT_DB.forEach(su=>{
    for(let i=0;i<sel.supports[su.id];i++) deck.push({...su, isEnergy:false, isRetreatEnergy:false, isItem:false, isSpecial:false, isSupport:true});
  });
  return deck;
}

const DECK_SIZE = 70;
const CHAR_STAGE_CAP = { easy:4, normal:3, hard:3, lunatic:3 };

function autoBuildDeck(){
  const sel = freshSelections();
  // キャラクター：3体を選び、easyは3枚・normal〜lunaticは各1枚採用
  // easyを厚めにして初手でキャラを出しやすくしつつ、lunaticまで育てられるようにする
  const ids = shuffle(CHAR_DB.map(c=>c.id)).slice(0,3);
  ids.forEach(id=>{ sel.chars[id].easy = 3; sel.chars[id].normal = 1; sel.chars[id].hard = 1; sel.chars[id].lunatic = 1; });
  // 特殊カードは全種1枚ずつ
  SPECIAL_DB.forEach(sp=>sel.specials[sp.id]=1);
  // サポートカードは全種2枚ずつ
  SUPPORT_DB.forEach(su=>sel.supports[su.id]=2);
  // 持ち物は全種2枚ずつ
  ITEM_DB.forEach(it=>sel.items[it.id]=2);
  const charTotal = ids.length * 6; // 18
  sel.retreatEnergy = 11;
  const used = charTotal + SPECIAL_DB.length + SUPPORT_DB.length*2 + ITEM_DB.length*2 + sel.retreatEnergy;
  sel.energy = Math.max(0, DECK_SIZE - used);
  return compileDeckFromSelections(sel);
}

function builderTotal(){
  const s = builder.selections;
  let charTotal = 0;
  Object.values(s.chars).forEach(stages=>{ STAGE_ORDER.forEach(st=>{ charTotal += stages[st]; }); });
  return charTotal + s.energy + (s.retreatEnergy||0)
       + Object.values(s.items).reduce((a,b)=>a+b,0)
       + Object.values(s.specials).reduce((a,b)=>a+b,0)
       + Object.values(s.supports).reduce((a,b)=>a+b,0);
}

const BUILDER_DRAFT_KEY = 'touhouTcgBuilderDraft';
const DECK_SLOTS_KEY = 'touhouTcgDeckSlots';
const DECK_SLOT_COUNT = 5;

function loadDeckSlots(){
  try{
    const raw = localStorage.getItem(DECK_SLOTS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    // 常にDECK_SLOT_COUNT個の配列にそろえる（足りない分はnullで埋める）
    const result = [];
    for(let i=0;i<DECK_SLOT_COUNT;i++){ result.push(arr[i] || null); }
    return result;
  }catch(e){
    return new Array(DECK_SLOT_COUNT).fill(null);
  }
}
function saveDeckSlots(slots){
  try{ localStorage.setItem(DECK_SLOTS_KEY, JSON.stringify(slots)); }catch(e){}
}
function isValidSavedDeckSelections(sel){
  if(!sel || typeof sel !== 'object') return false;
  if(!sel.chars || typeof sel.energy !== 'number' || !sel.items || !sel.specials || !sel.supports) return false;
  return true;
}
function saveDeckToSlot(slotIndex, selections, label){
  const slots = loadDeckSlots();
  slots[slotIndex] = {
    label: label || `スロット${slotIndex+1}`,
    savedAt: Date.now(),
    selections: JSON.parse(JSON.stringify(selections)),
  };
  saveDeckSlots(slots);
}
function loadDeckFromSlot(slotIndex){
  const slots = loadDeckSlots();
  const entry = slots[slotIndex];
  if(!entry || !isValidSavedDeckSelections(entry.selections)) return null;
  return repairBuilderSelections(entry.selections);
}
function clearDeckSlot(slotIndex){
  const slots = loadDeckSlots();
  slots[slotIndex] = null;
  saveDeckSlots(slots);
}

function saveBuilderDraft(){
  if(!builder) return;
  try{ localStorage.setItem(BUILDER_DRAFT_KEY, JSON.stringify(builder)); }catch(e){}
}
function loadBuilderDraft(){
  try{
    const raw = localStorage.getItem(BUILDER_DRAFT_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearBuilderDraft(){
  try{ localStorage.removeItem(BUILDER_DRAFT_KEY); }catch(e){}
}
function repairBuilderSelections(sel){
  if(!sel || typeof sel !== 'object') sel = {};
  const chars = (sel.chars && typeof sel.chars === 'object') ? sel.chars : {};
  CHAR_DB.forEach(c=>{
    const st = (chars[c.id] && typeof chars[c.id] === 'object') ? chars[c.id] : {};
    chars[c.id] = {
      easy: typeof st.easy === 'number' ? st.easy : 0,
      normal: typeof st.normal === 'number' ? st.normal : 0,
      hard: typeof st.hard === 'number' ? st.hard : 0,
      lunatic: typeof st.lunatic === 'number' ? st.lunatic : 0,
    };
  });
  const items = (sel.items && typeof sel.items === 'object') ? sel.items : {};
  ITEM_DB.forEach(it=>{ if(typeof items[it.id] !== 'number') items[it.id] = 0; });
  const specials = (sel.specials && typeof sel.specials === 'object') ? sel.specials : {};
  SPECIAL_DB.forEach(sp=>{ if(typeof specials[sp.id] !== 'number') specials[sp.id] = 0; });
  const supports = (sel.supports && typeof sel.supports === 'object') ? sel.supports : {};
  SUPPORT_DB.forEach(su=>{ if(typeof supports[su.id] !== 'number') supports[su.id] = 0; });
  const energy = typeof sel.energy === 'number' ? sel.energy : 0;
  return { chars, energy, items, specials, supports };
}
function isValidBuilderDraft(draft){
  return !!(draft && typeof draft === 'object' && (draft.mode === 'cpu' || draft.mode === 'hotseat') && draft.decks);
}

function beginDeckBuilding(mode, aiDifficulty){
  builder = {
    mode:mode,
    aiDifficulty: aiDifficulty || 'normal',
    playerIdx: mode === 'online' ? myPlayerIdx : 0,
    decks:[null,null],
    selections:freshSelections(),
    filterOpen:false,
    charFilter:{ types:[], elements:[], weaknesses:[] },
    slotModalOpen:false
  };
  if(mode === 'cpu'){
    builder.decks[1] = autoBuildDeck();
  }
  renderBuilder();
}

function adjustCharStage(id, stage, delta){
  const v = builder.selections.chars[id][stage] + delta;
  if(v < 0 || v > CHAR_STAGE_CAP[stage]) return;
  if(builderTotal() + delta > DECK_SIZE) return;
  builder.selections.chars[id][stage] = v;
  renderBuilder();
}
function adjustEnergy(delta){
  const current = builder.selections.energy;
  const maxAdd = DECK_SIZE - builderTotal();
  const actualDelta = delta > 0 ? Math.min(delta, maxAdd) : Math.max(delta, -current);
  if(actualDelta === 0) return;
  builder.selections.energy = current + actualDelta;
  renderBuilder();
}
function adjustRetreatEnergy(delta){
  const current = builder.selections.retreatEnergy||0;
  const maxAdd = DECK_SIZE - builderTotal();
  const actualDelta = delta > 0 ? Math.min(delta, maxAdd) : Math.max(delta, -current);
  if(actualDelta === 0) return;
  builder.selections.retreatEnergy = current + actualDelta;
  renderBuilder();
}
function adjustItem(id, delta){
  const v = builder.selections.items[id] + delta;
  if(v < 0 || v > 4) return;
  if(builderTotal() + delta > DECK_SIZE) return;
  builder.selections.items[id] = v;
  renderBuilder();
}
function adjustSpecial(id, delta){
  const v = builder.selections.specials[id] + delta;
  if(v < 0 || v > 5) return;
  if(builderTotal() + delta > DECK_SIZE) return;
  builder.selections.specials[id] = v;
  renderBuilder();
}
function adjustSupport(id, delta){
  const v = builder.selections.supports[id] + delta;
  if(v < 0 || v > 5) return;
  if(builderTotal() + delta > DECK_SIZE) return;
  builder.selections.supports[id] = v;
  renderBuilder();
}

function randomInt(min, max){
  return min + Math.floor(Math.random() * (max - min + 1));
}

function autoFillBuilder(){
  // 各カテゴリの目標枚数を範囲内でランダムに決め、合計がちょうど70枚になるよう微調整する
  const ranges = {
    energy:[20,30], retreatEnergy:[7,15],
    easy:[12,15], normal:[4,12], hard:[2,6], lunatic:[0,5],
    items:[4,8], specials:[5,12], supports:[5,12],
  };
  const targets = {};

  // 1. 霊力エネルギー・交代エネルギーの枚数を先に決める
  targets.energy = randomInt(ranges.energy[0], ranges.energy[1]);
  targets.retreatEnergy = randomInt(ranges.retreatEnergy[0], ranges.retreatEnergy[1]);

  // 2. キャラクターカード：easyを先に決め、normal→hard→lunaticの順に「直前の段階より少なくなる」ことを優先しつつ決める
  //    （直前の段階の最小値を下回ってしまう場合のみ、同数までは許容する）
  function nextStageCount(range, prevCount){
    const strictUpper = prevCount - 1;
    const upper = (strictUpper >= range[0]) ? Math.min(range[1], strictUpper) : Math.min(range[1], prevCount);
    return randomInt(range[0], Math.max(range[0], upper));
  }
  targets.easy = randomInt(ranges.easy[0], ranges.easy[1]);
  targets.normal = nextStageCount(ranges.normal, targets.easy);
  targets.hard = nextStageCount(ranges.hard, targets.normal);
  targets.lunatic = nextStageCount(ranges.lunatic, targets.hard);

  // 3. 持ち物・特殊・サポートの枚数を決める
  ['items','specials','supports'].forEach(k=>{ targets[k] = randomInt(ranges[k][0], ranges[k][1]); });

  let diff = DECK_SIZE - Object.values(targets).reduce((a,b)=>a+b,0);
  // まずキャラ以外（エネルギー・持ち物・特殊・サポート）で調整し、それでも埋まらない分だけキャラ段階を調整する
  const priorityKeys = ['energy','retreatEnergy','items','specials','supports'];
  const fallbackKeys = ['easy','normal','hard','lunatic'];
  let guard = 0;
  while(diff !== 0 && guard < 5000){
    guard++;
    const pool = priorityKeys.some(k=> (diff>0 ? targets[k]<ranges[k][1] : targets[k]>ranges[k][0]) ) ? priorityKeys : fallbackKeys;
    const k = pool[Math.floor(Math.random()*pool.length)];
    if(diff > 0 && targets[k] < ranges[k][1]){ targets[k]++; diff--; }
    else if(diff < 0 && targets[k] > ranges[k][0]){ targets[k]--; diff++; }
  }
  // 範囲内での調整だけで届かなかった端数は、影響が少ない霊力エネルギーで吸収する
  if(diff !== 0){ targets.energy += diff; diff = 0; }
  if(targets.energy < 0) targets.energy = 0;

  // easyの枚数 >= normalの枚数 >= hardの枚数 >= lunaticの枚数 となるよう、大きい方から順に切り詰める（安全策）
  const beforeOrderTotal = targets.easy + targets.normal + targets.hard + targets.lunatic;
  if(targets.normal > targets.easy) targets.normal = targets.easy;
  if(targets.hard > targets.normal) targets.hard = targets.normal;
  if(targets.lunatic > targets.hard) targets.lunatic = targets.hard;
  const afterOrderTotal = targets.easy + targets.normal + targets.hard + targets.lunatic;
  // 切り詰めた分は霊力エネルギーで補い、合計70枚を保つ
  targets.energy += (beforeOrderTotal - afterOrderTotal);

  // キャラクター：easy→normal→hard→lunaticの順で、前段階を持つキャラから優先的に選ぶ
  const chars = {}; CHAR_DB.forEach(c=>{ chars[c.id] = { easy:0, normal:0, hard:0, lunatic:0 }; });
  function fillStage(stage, target, prevStage){
    const cap = CHAR_STAGE_CAP[stage];
    const eligibleIds = CHAR_DB.map(c=>c.id).filter(id => !prevStage || chars[id][prevStage] > 0);
    if(eligibleIds.length === 0) return; // 前段階を持つキャラが誰もいなければ進化先は選べない
    const weight = {}; eligibleIds.forEach(id=>{ weight[id] = 1; }); // 初期重みは全員1（完全ランダム）
    let remaining = target;
    let safety = 0;
    while(remaining > 0 && safety < 5000){
      safety++;
      const pool = eligibleIds.filter(id => chars[id][stage] < cap);
      if(pool.length === 0) break;
      const totalWeight = pool.reduce((sum,id)=>sum + weight[id], 0);
      let r = Math.random() * totalWeight;
      let picked = pool[pool.length-1];
      for(const id of pool){
        r -= weight[id];
        if(r <= 0){ picked = id; break; }
      }
      chars[picked][stage]++;
      weight[picked] = 10; // 一度選ばれたキャラは、以後このカードの選ばれる確率が10倍になる（重ねがけしない）
      remaining--;
    }
  }
  fillStage('easy', targets.easy, null);
  fillStage('normal', targets.normal, 'easy');
  fillStage('hard', targets.hard, 'normal');
  fillStage('lunatic', targets.lunatic, 'hard');

  // 万一、対象キャラが足りず狙った枚数まで埋められなかった場合は、その分を霊力エネルギーで補って合計70枚を保証する
  let actualCharTotal = 0;
  Object.values(chars).forEach(st=>{ actualCharTotal += st.easy+st.normal+st.hard+st.lunatic; });
  const plannedCharTotal = targets.easy + targets.normal + targets.hard + targets.lunatic;
  const shortfall = plannedCharTotal - actualCharTotal;
  if(shortfall > 0) targets.energy += shortfall;

  // 持ち物・特殊・サポート：各1種類あたりの上限内でランダムに選ぶ
  function fillRandomCards(dbArr, target, capPerCard){
    const map = {}; dbArr.forEach(c=>map[c.id]=0);
    let remaining = target;
    let safety = 0;
    while(remaining > 0 && safety < 5000){
      safety++;
      const pick = dbArr[Math.floor(Math.random()*dbArr.length)];
      if(map[pick.id] < capPerCard){ map[pick.id]++; remaining--; }
    }
    return map;
  }
  const items = fillRandomCards(ITEM_DB, targets.items, 4);
  const specials = fillRandomCards(SPECIAL_DB, targets.specials, 5);
  const supports = fillRandomCards(SUPPORT_DB, targets.supports, 5);

  builder.selections = { chars, energy: targets.energy, retreatEnergy: targets.retreatEnergy, items, specials, supports };
  renderBuilder();
}

function confirmBuilderDeck(){
  if(builderTotal() !== DECK_SIZE) return;
  const deck = compileDeckFromSelections(builder.selections);
  builder.decks[builder.playerIdx] = deck;
  if(builder.mode === 'online'){
    builder = null;
    clearBuilderDraft();
    if(netRole === 'host'){
      onlineHostOwnDeck = deck;
      if(onlineGuestDeck){
        startOnlineGame();
      } else {
        onlineUI = { phase:'deck-wait' };
        renderOnlineUI();
      }
    } else if(netRole === 'guest'){
      if(conn && conn.open){ conn.send({ t:'deck', deck: deck }); }
      onlineUI = { phase:'deck-wait' };
      renderOnlineUI();
    }
    return;
  }
  if(builder.mode === 'hotseat' && builder.playerIdx === 0){
    builder.playerIdx = 1;
    builder.selections = freshSelections();
    builder.filterOpen = false;
    builder.charFilter = { types:[], elements:[], weaknesses:[] };
    renderBuilder();
  } else {
    const mode = builder.mode;
    const aiDifficulty = builder.aiDifficulty || 'normal';
    const decksTemplate = builder.decks.map(d=>d.slice());
    savedMode = mode;
    savedDecks = decksTemplate;
    builder = null;
    clearBuilderDraft();
    const startingIdx = Math.random() < 0.5 ? 0 : 1;
    initGame(mode, [shuffle(decksTemplate[0].slice()), shuffle(decksTemplate[1].slice())], startingIdx, aiDifficulty);
  }
}

/* =========================================================
   対戦ロジック
========================================================= */
function log(msg){ state.log.push(msg); }
function lname(n){ return `<span class="log-name">${n}</span>`; }
function ldmg(n){ return `<span class="log-dmg">${n}ダメージ</span>`; }
function lheal(n){ return `<span class="log-heal">${n}回復</span>`; }
function lreduce(n){ return `<span class="log-reduce">${n}軽減</span>`; }

function dealInitialHandWithMulligan(player){
  for(let attempt=0; attempt<=3; attempt++){
    if(attempt > 0){
      player.deck = player.deck.concat(player.hand);
      player.hand = [];
      shuffle(player.deck);
      log(`${player.name}の手札にeasyキャラクターがいないため引き直した（${attempt}回目）。`);
    }
    player.hand = [];
    for(let i=0;i<5;i++){ if(player.deck.length) player.hand.push(player.deck.pop()); }
    if(player.hand.some(c=>!c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport && (c.cardStage||'easy')==='easy')) return true;
  }
  return false;
}

function ensureCpuOpeningEasyCards(player, minimumEasy=2){
  const isEasy = c => c && !c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport && (c.cardStage || 'easy') === 'easy';
  let easyCount = player.hand.filter(isEasy).length;
  while(easyCount < minimumEasy){
    const easyIndex = player.deck.findIndex(isEasy);
    if(easyIndex < 0) break;
    const replacementIndex = player.hand.findIndex(c=>!isEasy(c));
    if(replacementIndex < 0) break;
    const easyCard = player.deck.splice(easyIndex,1)[0];
    const replacedCard = player.hand.splice(replacementIndex,1,easyCard)[0];
    player.deck.push(replacedCard);
    easyCount++;
  }
  shuffle(player.deck);
  return easyCount >= minimumEasy;
}

function initGame(mode, decks, startingIdx, aiDifficulty){
  const isCpu = mode === 'cpu';
  const isSpectator = mode === 'spectator';
  const isOnline = mode === 'online';
  const firstIdx = (startingIdx === 0 || startingIdx === 1) ? startingIdx : 0;
  state = {
    mode: mode,
    aiDifficulty: aiDifficulty || 'normal',
    players: [
      { name: isCpu ? 'あなた' : (isSpectator ? 'CPU-1' : isOnline ? 'ホスト' : 'プレイヤー1'), deck:decks[0], hand:[], discard:[], main:null, bench:[null,null,null], knockouts:0, turnsStarted:0 },
      { name: isCpu ? 'CPU'   : (isSpectator ? 'CPU-2' : isOnline ? 'ゲスト' : 'プレイヤー2'), deck:decks[1], hand:[], discard:[], main:null, bench:[null,null,null], knockouts:0, turnsStarted:0 },
    ],
    turn:firstIdx,
    log:[],
    gameOver:false,
    winner:null,
    energyAttachedThisTurn:0,
    itemAttachedThisTurn:false,
    specialUsedThisTurn:false,
    retreatUsedThisTurn:false,
    resignConfirmPending:false,
    selectedHandIndex:null,
    forcedSwapPending:null,
    pendingMoveIndex:null,
    promotionPending:null,
    cardChoicePending:null,
    gapSwapPending:null,
    evolveChoicePending:null,
    benchBuffPending:null,
    logVisible:true,
  };

  let loserIdx = null;
  state.players.forEach((p,pi)=>{
    const ok = dealInitialHandWithMulligan(p);
    if(!ok && !isAiControlled(pi)) loserIdx = pi;
  });

  if(loserIdx !== null){
    log(`${state.players[loserIdx].name}は3回引き直してもeasyキャラクターを引けなかったため敗北！`);
    endGame(1-loserIdx);
    return;
  }

  if(isCpu){
    const cpu = state.players[1];
    if(ensureCpuOpeningEasyCards(cpu, 2)){
      log('CPUの初期手札を調整し、easyキャラクターを2枚以上確保した。');
    }
  } else if(isSpectator){
    state.players.forEach(p=>{ ensureCpuOpeningEasyCards(p, 2); });
  }

  log(isCpu
    ? `ゲーム開始。${firstIdx===0?'あなた':'CPU'}が先攻です。手札のキャラクターカードをタップしてメインに出しましょう。`
    : isSpectator
      ? `観戦モード開始。${state.players[firstIdx].name}が先攻です。`
      : `ゲーム開始。${state.players[firstIdx].name}が先攻です。手札のキャラクターカードをタップしてメインに出しましょう。`);
  render();
  if((state.mode === 'cpu' && firstIdx === 1) || state.mode === 'spectator'){
    if(!state.gameOver){ aiActingIdx = firstIdx; aiTakeTurn(); }
  }
}

function isHumanTurnNow(){
  if(!state || state.gameOver) return false;
  if(state.mode === 'spectator') return false;
  if(state.disconnected) return false;
  return getSelfIdx() === state.turn;
}

function isAiControlled(playerIdx){
  return (state.mode === 'cpu' && playerIdx === 1) || state.mode === 'spectator';
}

function processStatusTick(idx, resumeFn){
  const player = state.players[idx];
  const inst = player.main;
  if(!inst || !inst.status) return 'ok';

  if(inst.status.type === 'burn'){
    const amount = inst.status.amount || 5;
    inst.hp -= amount;
    log(`${lname(inst.card.name)}はやけどの${ldmg(amount)}を受けた！`);
    inst.status.turnsLeft--;
    const sourceIdx = inst.status.sourcePlayerIdx;
    if(inst.status.turnsLeft <= 0){ log(`${lname(inst.card.name)}のやけどが治った。`); inst.status = null; }
    if(inst.hp <= 0){
      log(`${lname(inst.card.name)}は倒れた…`);
      player.discard.push(inst.card);
      player.main = null;
      if(sourceIdx !== null && sourceIdx !== undefined && state.players[sourceIdx]){
        const attacker = state.players[sourceIdx];
        attacker.knockouts = (attacker.knockouts||0) + 1;
        log(`（${lname(attacker.name)}の撃破数: ${attacker.knockouts}/5）`);
        if(attacker.knockouts >= 5){ endGame(sourceIdx); return 'ended'; }
      }
      const hasBench = player.bench.some(b=>b!==null);
      if(hasBench){
        const pending = triggerPromotion(idx, resumeFn);
        return pending ? 'pending' : 'ok';
      }
      // ベンチが空でも、5体撃破に達していなければ試合は続行する
    }
  } else if(inst.status.type === 'regen'){
    const amount = inst.status.amount || 7;
    healInstance(inst, amount);
    log(`${lname(inst.card.name)}は再生の効果でHPを${lheal(amount)}した！`);
    inst.status.turnsLeft--;
    if(inst.status.turnsLeft <= 0){ log(`${lname(inst.card.name)}の再生が切れた。`); inst.status = null; }
  } else if(inst.status.type === 'freeze'){
    inst.status.turnsLeft--;
    if(inst.status.turnsLeft <= 0){ log(`${lname(inst.card.name)}の凍結が解けた。`); inst.status = null; }
  } else if(inst.status.type === 'shield'){
    inst.status.turnsLeft--;
    if(inst.status.turnsLeft <= 0){ log(`${lname(inst.card.name)}の結界が消えた。`); inst.status = null; }
  } else if(inst.status.type === 'curse'){
    inst.status.turnsLeft--;
    if(inst.status.turnsLeft <= 0){ log(`${lname(inst.card.name)}の道連れの呪いが解けた。`); inst.status = null; }
  }
  return 'ok';
}

function triggerPromotion(playerIdx, resumeFn){
  const player = state.players[playerIdx];
  const isCpuControlled = isAiControlled(playerIdx);
  if(isCpuControlled){
    let bestIdx = -1, bestHp = -1;
    player.bench.forEach((b,i)=>{ if(b && b.hp > bestHp){ bestHp = b.hp; bestIdx = i; } });
    player.main = player.bench[bestIdx];
    player.bench[bestIdx] = null;
    log(`${lname(player.main.card.name)}がメインに繰り上がった！`);
    return false; // 同期的に解決済み（保留なし）
  }
  state.promotionPending = { playerIdx, resumeFn };
  log(`${lname(player.name)}はベンチから繰り上げるキャラを選んでください。`);
  render();
  return true; // 保留中
}
function resolvePromotion(benchIndex){
  if(!state.promotionPending) return;
  const pending = state.promotionPending;
  const player = state.players[pending.playerIdx];
  if(!player.bench[benchIndex]) return;
  player.main = player.bench[benchIndex];
  player.bench[benchIndex] = null;
  log(`${lname(player.main.card.name)}がメインに繰り上がった！`);
  state.promotionPending = null;
  const fn = pending.resumeFn;
  if(fn){ fn(); } else { render(); }
}

function hasAnyCharacter(player){
  return !!player.main || player.bench.some(b=>b !== null);
}

function checkCharacterPresenceCondition(idx){
  const current = state.players[idx];
  const opponent = state.players[1-idx];

  if((current.turnsStarted||0) >= 1 && !hasAnyCharacter(current)){
    log(`${current.name}はメインにもベンチにもキャラクターがいないため敗北した！`);
    endGame(1-idx);
    return true;
  }
  if((opponent.turnsStarted||0) >= 1 && !hasAnyCharacter(opponent)){
    log(`${opponent.name}はメインにもベンチにもキャラクターがいないため敗北した！`);
    endGame(idx);
    return true;
  }
  return false;
}

function startTurn(idx){
  state.turn = idx;
  if(checkCharacterPresenceCondition(idx)) return;
  continueStartTurnAfterStatus(idx);
}

function processFieldPassives(player, idx){
  const fielded = [player.main, ...player.bench].filter(Boolean);
  fielded.forEach(inst=>{
    const passive = inst.card.passive;
    if(!passive) return;
    if(passive.type === 'selfHealPerTurn'){
      const before = inst.hp;
      healInstance(inst, passive.amount);
      if(inst.hp > before) log(`${lname(inst.card.name)}は自分の能力でHPを${lheal(inst.hp-before)}した！`);
    }
    if(passive.type === 'finisherLowHp' && idx !== undefined && inst === player.main){
      const opponent = state.players[1-idx];
      const targets = [];
      if(opponent.main && opponent.main.hp > 0 && opponent.main.hp <= passive.threshold) targets.push({ inst:opponent.main, isMain:true });
      opponent.bench.forEach((b,i)=>{ if(b && b.hp > 0 && b.hp <= passive.threshold) targets.push({ inst:b, isMain:false, idx:i }); });
      targets.forEach(t=>{
        log(`${lname(inst.card.name)}の特性が発動！ ${lname(t.inst.card.name)}に${ldmg(passive.amount)}！`);
        if(t.isMain){
          damageMainAndCheck(opponent, 1-idx, passive.amount, player, idx);
        } else {
          damageBenchAndCheck(opponent, t.idx, passive.amount, player, idx);
        }
      });
    }
  });
  if(player.main){
    const mp = player.main.card.passive;
    if(mp && mp.type === 'chanceAttachEnergyIfMain' && Math.random() < mp.chance){
      player.main.energy = (player.main.energy||0) + 1;
      log(`${lname(player.main.card.name)}は自分の能力で霊力エネルギーを1枚つけた！`);
    }
    if(mp && mp.type === 'chanceDrawIfMain' && Math.random() < mp.chance){
      if(player.deck.length){
        player.hand.push(player.deck.pop());
        log(`${lname(player.main.card.name)}は自分の能力で山札から1枚引いた！`);
      }
    }
  }
}

function continueStartTurnAfterStatus(idx){
  if(checkCharacterPresenceCondition(idx)) return;
  const player = state.players[idx];
  if(player.main) player.main.blockedThisTurn = false;
  player.bench.forEach(b=>{ if(b) b.blockedThisTurn = false; });
  if(player.retreatLockedTurns > 0){
    player.retreatLockedTurns--;
    if(player.retreatLockedTurns <= 0) log(`${lname(player.name)}の交代封じが解けた。`);
  }
  if(player.main && player.main.reverseWeaknessTurns > 0){
    player.main.reverseWeaknessTurns--;
    if(player.main.reverseWeaknessTurns <= 0) log(`${lname(player.main.card.name)}の弱点逆呪が解けた。`);
  }
  if(player.main && player.main.weaknessNegatedTurns > 0){
    player.main.weaknessNegatedTurns--;
    if(player.main.weaknessNegatedTurns <= 0) log(`${lname(player.main.card.name)}のお守りの効果が切れた。`);
  }
  if(player.deck.length === 0){
    log(`${player.name}の山札が尽きた…`);
    endGame(1-idx);
    return;
  }
  const drawn = player.deck.pop();
  player.hand.push(drawn);
  log(`--- ${player.name}のターン --- ${drawn.isEnergy ? '霊力エネルギー' : drawn.name}を引いた。`);
  processFieldPassives(player, idx);
  state.energyAttachedThisTurn = 0;
  state.itemAttachedThisTurn = false;
  state.specialUsedThisTurn = false;
  state.retreatUsedThisTurn = false;
  state.resignConfirmPending = false;
  state.selectedHandIndex = null;
  state.pendingMoveIndex = null;
  render();
  player.turnsStarted = (player.turnsStarted||0) + 1;
  if((state.mode === 'cpu' && idx === 1) || state.mode === 'spectator'){
    if(!state.gameOver){ aiActingIdx = idx; aiTakeTurn(); }
  }
}

function endTurn(){
  if(state.gameOver) return;
  const endingIdx = state.turn;
  const nextIdx = 1-endingIdx;
  const endingPlayer = state.players[endingIdx];
  // 特性による自傷ダメージ（自分のターン終了時、メインにいる場合のみ）
  if(endingPlayer.main && endingPlayer.main.card.passive && endingPlayer.main.card.passive.type === 'selfDamagePerTurn'){
    const amount = endingPlayer.main.card.passive.amount;
    endingPlayer.main.hp -= amount;
    log(`${lname(endingPlayer.main.card.name)}は自分の特性で${ldmg(amount)}を受けた！`);
    if(endingPlayer.main.hp <= 0){
      log(`${lname(endingPlayer.main.card.name)}は倒れた…`);
      endingPlayer.discard.push(endingPlayer.main.card);
      endingPlayer.main = null;
      const hasBench = endingPlayer.bench.some(b=>b!==null);
      if(hasBench){
        const pending = triggerPromotion(endingIdx, ()=>{
          const result2 = processStatusTick(endingIdx, ()=>startTurn(nextIdx));
          if(result2 === 'ended' || result2 === 'pending') return;
          startTurn(nextIdx);
        });
        if(pending) return;
      }
    }
  }
  // 状態異常は「かかっている本人のターン終了時」に効果が発動・消滅する
  const result = processStatusTick(endingIdx, ()=>startTurn(nextIdx));
  if(result === 'ended' || result === 'pending') return;
  startTurn(nextIdx);
}

function endGame(winnerIdx){
  state.gameOver = true;
  state.winner = winnerIdx;
  log(`🎉 ${state.players[winnerIdx].name}の勝利！`);
  render();
}

function onResignClick(actingIdx){
  if(!state || state.gameOver) return;
  if(!state.resignConfirmPending){
    state.resignConfirmPending = true;
    render();
    return;
  }
  // actingIdx はクリックした側（act()経由）から明示的に渡される。
  // オンライン対戦ではホストが「ゲストの代わりに」この関数を実行するため、
  // ここで getSelfIdx() を呼ぶとホスト自身の視点になってしまい誤判定するので使わない。
  const selfIdx = (typeof actingIdx === 'number') ? actingIdx : getSelfIdx();
  log(`${state.players[selfIdx].name}が投了した。`);
  endGame(1-selfIdx);
}

function startCardChoice(player, playerIdx, options){
  if(options.length === 0) return;
  if(options.length === 1){
    const chosen = options[0];
    player.hand.push(chosen);
    log(`${lname(player.name)}は山札から「${chosen.name}」を手札に加えた！`);
    return;
  }
  if(isAiControlled(playerIdx)){
    let bestIdx = 0, bestScore = -1;
    options.forEach((c,i)=>{ const score = (typeof c.hp === 'number') ? c.hp : 0; if(score > bestScore){ bestScore = score; bestIdx = i; } });
    const chosen = options[bestIdx];
    player.hand.push(chosen);
    options.forEach((c,i)=>{ if(i!==bestIdx) player.deck.push(c); });
    shuffle(player.deck);
    log(`${lname(player.name)}は山札から「${chosen.name}」を選んで手札に加えた！`);
  } else {
    state.cardChoicePending = { playerIdx, options };
    render();
  }
}

function useChooseFromTwo(player, playerIdx){
  const isChar = c => !c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport;
  const idxs = player.deck.map((c,i)=>isChar(c)?i:null).filter(i=>i!==null);
  if(idxs.length === 0){ log(`${lname(player.name)}の山札にキャラクターカードがない。`); return; }
  shuffle(idxs);
  const picked = idxs.slice(0, Math.min(3, idxs.length));
  const sortedDesc = [...picked].sort((a,b)=>b-a);
  const options = sortedDesc.map(i=>player.deck.splice(i,1)[0]);
  startCardChoice(player, playerIdx, options);
}

function useScoutTop3(player, playerIdx){
  const n = Math.min(3, player.deck.length);
  if(n === 0){ log(`${lname(player.name)}の山札にカードがない。`); return; }
  const options = player.deck.splice(player.deck.length-n, n);
  startCardChoice(player, playerIdx, options);
}

function resolveCardChoice(chosenIndex){
  if(!state.cardChoicePending) return;
  const { playerIdx, options } = state.cardChoicePending;
  const player = state.players[playerIdx];
  const chosen = options[chosenIndex];
  player.hand.push(chosen);
  options.forEach((c,i)=>{ if(i!==chosenIndex) player.deck.push(c); });
  shuffle(player.deck);
  log(`${lname(player.name)}は山札から「${chosen.name}」を選んで手札に加えた！`);
  state.cardChoicePending = null;
  render();
}

function resolveEvolveChoice(optionIndex){
  if(!state.evolveChoicePending) return;
  const { card, options } = state.evolveChoicePending;
  const player = state.players[state.turn];
  const opt = options[optionIndex];
  if(!opt) return;
  const evoTarget = opt.isMain ? player.main : player.bench[opt.benchIdx];
  if(!evoTarget){ state.evolveChoicePending = null; render(); return; }
  evolveInstance(evoTarget);
  evoTarget.blockedThisTurn = true;
  const idx = player.hand.indexOf(card);
  if(idx >= 0) player.hand.splice(idx,1);
  const evolvedHpBonus = stageIdx(evoTarget) * 10;
  log(`${lname(evoTarget.card.name)}は${STAGE_LABEL[evoTarget.stage]}に進化した！（HP+${evolvedHpBonus}・攻撃+5）`);
  state.evolveChoicePending = null;
  state.selectedHandIndex = null;
  render();
}

function useGapSwap(player, opponent, playerIdx){
  const damagedIdxs = opponent.bench.map((b,i)=> (b && b.hp < getMaxHp(b)) ? i : null).filter(i=>i!==null);
  if(!opponent.main || damagedIdxs.length === 0){
    log('入れ替えられる対象がいない（相手のベンチにダメージを受けているキャラがいない）。');
    return;
  }
  if(isAiControlled(playerIdx)){
    let bestIdx = damagedIdxs[0], bestHp = Infinity;
    damagedIdxs.forEach(i=>{ if(opponent.bench[i].hp < bestHp){ bestHp = opponent.bench[i].hp; bestIdx = i; } });
    const tmp = opponent.main;
    opponent.main = opponent.bench[bestIdx];
    opponent.bench[bestIdx] = tmp;
    clearStatusOnBenched(tmp);
    log(`${lname(opponent.name)}の${lname(opponent.main.card.name)}とベンチが入れ替わった！`);
  } else {
    state.gapSwapPending = { playerIdx };
    render();
  }
}

function resolveGapSwap(benchIndex){
  if(!state.gapSwapPending) return;
  const { playerIdx } = state.gapSwapPending;
  const opponent = state.players[1-playerIdx];
  const target = opponent.bench[benchIndex];
  if(!target || target.hp >= getMaxHp(target)) return;
  const tmp = opponent.main;
  opponent.main = target;
  opponent.bench[benchIndex] = tmp;
  clearStatusOnBenched(tmp);
  log(`${lname(opponent.name)}の${lname(opponent.main.card.name)}とベンチが入れ替わった！`);
  state.gapSwapPending = null;
  render();
}

function onHandCardClick(index){
  if(state.gameOver || state.forcedSwapPending || state.benchBuffPending) return;
  const player = state.players[state.turn];
  const card = player.hand[index];
  if(!card) return;

  if(card.isEnergy || card.isRetreatEnergy || card.isItem){
    if(state.selectedHandIndex === index){
      state.selectedHandIndex = null;
    } else {
      if(card.isEnergy && state.energyAttachedThisTurn >= 2){ log('このターンは霊力エネルギーを2枚までしか付けられません。'); render(); return; }
      if(card.isItem && state.itemAttachedThisTurn){ log('このターンはすでに持ち物を使いました。'); render(); return; }
      state.selectedHandIndex = index;
      log(card.isEnergy
        ? '霊力エネルギーを選択した。付ける相手（メインかベンチ）をタップしてください。'
        : card.isRetreatEnergy
          ? '交代エネルギーを選択した。付ける相手（メインかベンチ）をタップしてください。'
          : `「${card.name}」を選択した。持たせる相手（メインかベンチ）をタップしてください。`);
    }
    render();
    return;
  }

  if(card.isSpecial || card.isSupport){
    if(card.isSpecial && state.specialUsedThisTurn){ log('このターンはすでに特殊カードを使いました。'); render(); return; }
    const t = card.effectType;

    if(t === 'forcedSwap'){
      log(`「${card.name}」を使用`);
      useForcedSwap();
      player.hand.splice(index,1);
      state.specialUsedThisTurn = true;
      render();
      return;
    }
    if(t === 'chooseFromTwo'){
      log(`「${card.name}」を使用`);
      useChooseFromTwo(player, state.turn);
      player.hand.splice(index,1);
      state.specialUsedThisTurn = true;
      render();
      return;
    }
    if(t === 'gapSwap'){
      log(`「${card.name}」を使用`);
      useGapSwap(player, state.players[1-state.turn], state.turn);
      player.hand.splice(index,1);
      state.specialUsedThisTurn = true;
      render();
      return;
    }
    if(t === 'scoutTop3'){
      log(`「${card.name}」を使用`);
      useScoutTop3(player, state.turn);
      player.hand.splice(index,1);
      render();
      return;
    }
    if(t === 'drawCards' || t === 'healMain' || t === 'searchRandomChar' || t === 'searchRandomEasy' || t === 'redrawHand' || t === 'teamShield' || t === 'revealHandCards' || t === 'negateWeaknessSelf' || t === 'halfDamageNext' || t === 'nukeBench' || t === 'kamikakushi'){
      resolveNoTargetCard(player, card);
      const actualIndex = player.hand.indexOf(card);
      if(actualIndex >= 0) player.hand.splice(actualIndex,1);
      if(card.isSpecial) state.specialUsedThisTurn = true;
      render();
      return;
    }
    // 対象選択が必要なカード（自分側 or 敵側）
    if(state.selectedHandIndex === index){
      state.selectedHandIndex = null;
    } else {
      if(t === 'energyPlus' && !player.main && !player.bench.some(Boolean)){ log('エネルギーを付けるキャラクターがいません。'); render(); return; }
      state.selectedHandIndex = index;
      const side = t === 'energyMinus' ? '相手の' : '味方の';
      log(`「${card.name}」を選択した。${side}対象（メインかベンチ）をタップしてください。`);
    }
    render();
    return;
  }

  // キャラクターカード：cardStageが'easy'なら新規配置専用、それ以外は対応する前段階を進化させる専用
  const cardStage = card.cardStage || 'easy';

  if(cardStage === 'easy'){
    if(!player.main){
      player.main = { card:card, hp:card.hp, energy:0, item:null, maxHpBonus:0, status:null, stage:'easy', blockedThisTurn:true };
      player.hand.splice(index,1);
      log(`${card.name}をメインに出した！（HP${card.hp}）`);
    } else {
      const benchIdx = player.bench.findIndex(b=>b===null);
      if(benchIdx === -1){
        log('場がいっぱいです（メイン＋ベンチ3体）。');
        render(); return;
      }
      player.bench[benchIdx] = { card:card, hp:card.hp, energy:0, item:null, maxHpBonus:0, status:null, stage:'easy', blockedThisTurn:true };
      player.hand.splice(index,1);
      log(`${card.name}をベンチに出した！（HP${card.hp}）`);
    }
  } else {
    const requiredPrevStage = STAGE_ORDER[STAGE_ORDER.indexOf(cardStage)-1];
    const canEvolve = c => c && c.card.id === card.id && (c.stage||'easy') === requiredPrevStage && !c.blockedThisTurn;

    const eligibleTargets = [];
    if(canEvolve(player.main)) eligibleTargets.push({ isMain:true, benchIdx:null });
    player.bench.forEach((b,i)=>{ if(canEvolve(b)) eligibleTargets.push({ isMain:false, benchIdx:i }); });

    if(eligibleTargets.length === 0){
      const blockedInstead = (player.main && player.main.card.id===card.id && (player.main.stage||'easy')===requiredPrevStage && player.main.blockedThisTurn)
        || player.bench.some(b=>b && b.card.id===card.id && (b.stage||'easy')===requiredPrevStage && b.blockedThisTurn);
      if(blockedInstead){
        log(`「${card.name}」（${STAGE_LABEL[cardStage]}）：このターンに出したばかり、または進化したばかりのキャラはさらに進化できません。`);
      } else {
        log(`「${card.name}」（${STAGE_LABEL[cardStage]}）で進化させられる${STAGE_LABEL[requiredPrevStage]}段階の${card.name}が場にいません。`);
      }
      render(); return;
    }

    const isCpuTurn = isAiControlled(state.turn);
    if(eligibleTargets.length > 1 && !isCpuTurn){
      // 進化先候補が複数いる場合、プレイヤーに選んでもらう
      state.evolveChoicePending = { card, cardStage, options: eligibleTargets };
      render();
      return;
    }

    const chosen = eligibleTargets[0];
    const evoTarget = chosen.isMain ? player.main : player.bench[chosen.benchIdx];
    evolveInstance(evoTarget);
    evoTarget.blockedThisTurn = true;
    player.hand.splice(index,1);
    const evolvedHpBonus = stageIdx(evoTarget) * 10;
    log(`${lname(evoTarget.card.name)}は${STAGE_LABEL[evoTarget.stage]}に進化した！（HP+${evolvedHpBonus}・攻撃+5）`);
  }
  state.selectedHandIndex = null;
  render();
}

function resolveNoTargetCard(player, card){
  const t = card.effectType;
  const useLabel = `「${card.name}」を使用`;
  if(t === 'drawCards'){
    let drew = 0;
    for(let i=0;i<card.amount;i++){ if(player.deck.length){ player.hand.push(player.deck.pop()); drew++; } }
    log(`${useLabel} → ${drew}枚ドロー`);
  } else if(t === 'healMain'){
    if(player.main){
      healInstance(player.main, card.amount);
      log(`${useLabel} → ${lname(player.main.card.name)}のHPを${lheal(card.amount)}`);
    } else {
      log(`${useLabel} → メインがいないため不発`);
    }
  } else if(t === 'searchRandomChar' || t === 'searchRandomEasy'){
    const isChar = c => !c.isEnergy && !c.isRetreatEnergy && !c.isItem && !c.isSpecial && !c.isSupport;
    const isEasy = c => isChar(c) && (c.cardStage || 'easy') === 'easy';
    const filter = t === 'searchRandomEasy' ? isEasy : isChar;
    const idxs = player.deck.map((c,i)=>filter(c)?i:null).filter(i=>i!==null);
    if(idxs.length === 0){
      log(`${useLabel} → ${t === 'searchRandomEasy' ? '山札にeasyキャラクターカードが残っておらず不発' : '山札にキャラクターカードが残っておらず不発'}`);
    } else {
      const pick = idxs[Math.floor(Math.random()*idxs.length)];
      const c = player.deck.splice(pick,1)[0];
      player.hand.push(c);
      log(`${useLabel} → 「${c.name}」を手札に加えた`);
    }
  } else if(t === 'redrawHand'){
    // 使用した特殊カード自身は除外し、残りの手札を山札へ戻して同じ枚数を引く。
    const currentHand = player.hand.filter(c => c !== card);
    const drawCount = currentHand.length;
    player.hand = [card];
    player.deck.push(...currentHand);
    shuffle(player.deck);
    let drew = 0;
    for(let i=0;i<drawCount;i++){
      if(player.deck.length){ player.hand.push(player.deck.pop()); drew++; }
    }
    log(`${useLabel} → 手札を山札に戻して${drew}枚引き直し`);
  } else if(t === 'teamShield'){
    const playerIdx = state.players.indexOf(player);
    const targets = [player.main, ...player.bench].filter(Boolean);
    targets.forEach(inst => applyStatus(inst, 'shield', playerIdx, card.amount, 2));
    log(`${useLabel} → ${targets.length ? `キャラ全員に結界（被ダメージ-${card.amount}）` : '場にキャラがおらず不発'}`);
  } else if(t === 'revealHandCards'){
    const playerIdx = state.players.indexOf(player);
    const opponent = state.players[1-playerIdx];
    const pool = opponent.hand.map((c,i)=>i).filter(i=>!opponent.hand[i]._revealedToPlayerIdx || opponent.hand[i]._revealedToPlayerIdx !== playerIdx);
    shuffle(pool);
    const targetIdxs = pool.slice(0, Math.min(card.amount, opponent.hand.length));
    const revealed = [];
    targetIdxs.forEach(i=>{ opponent.hand[i]._revealedToPlayerIdx = playerIdx; revealed.push(opponent.hand[i].name); });
    log(`${useLabel} → ${revealed.length ? `${lname(opponent.name)}の手札${revealed.length}枚を確認（${revealed.join('、')}）` : `${lname(opponent.name)}の手札は空だった`}`);
  } else if(t === 'negateWeaknessSelf'){
    if(player.main){
      player.main.weaknessNegatedTurns = Math.max(player.main.weaknessNegatedTurns||0, 1);
      log(`${useLabel} → ${lname(player.main.card.name)}は1ターンの間、弱点が無効化された`);
    } else {
      log(`${useLabel} → メインがいないため不発`);
    }
  } else if(t === 'halfDamageNext'){
    if(player.main){
      player.main.halfDamageNext = true;
      log(`${useLabel} → ${lname(player.main.card.name)}は次に受けるダメージが半分になる`);
    } else {
      log(`${useLabel} → メインがいないため不発`);
    }
  } else if(t === 'nukeBench'){
    const playerIdx = state.players.indexOf(player);
    const opponent = state.players[1-playerIdx];
    const hitNames = [];
    opponent.bench.forEach((b,i)=>{
      if(!b) return;
      hitNames.push(b.card.name);
      b.hp -= card.amount;
      if(b.hp <= 0){
        log(`${lname(b.card.name)}は倒れた…`);
        opponent.discard.push(b.card);
        opponent.bench[i] = null;
        player.knockouts = (player.knockouts||0) + 1;
        log(`（${lname(player.name)}の撃破数: ${player.knockouts}/5）`);
      }
    });
    log(`${useLabel} → ${hitNames.length ? `${lname(opponent.name)}のベンチ全員に${card.amount}ダメージ（${hitNames.join('、')}）` : `${lname(opponent.name)}のベンチは空だった`}`);
    if(player.knockouts >= 5){ endGame(playerIdx); }
  } else if(t === 'kamikakushi'){
    const validIdxs = player.bench.map((b,i)=> (b && b.hp >= getMaxHp(b)/2) ? i : null).filter(i=>i!==null);
    if(validIdxs.length === 0){
      log(`${useLabel} → HPが半分以上のベンチキャラがおらず不発`);
    } else {
      const idx = validIdxs[Math.floor(Math.random()*validIdxs.length)];
      const inst = player.bench[idx];
      const stage = inst.stage || 'easy';
      const baseCard = inst.card;
      const mkCard = (st) => ({...baseCard, isEnergy:false, isItem:false, isSpecial:false, isSupport:false, cardStage:st});
      const returnedStages = [];
      if(stage === 'normal'){
        player.deck.push(mkCard('easy'));
        player.deck.push(mkCard('normal'));
        returnedStages.push('easy','normal');
      } else {
        player.deck.push(mkCard(stage));
        returnedStages.push(stage);
      }
      player.bench[idx] = null;
      shuffle(player.deck);
      log(`${useLabel} → ${lname(inst.card.name)}（${returnedStages.map(s=>STAGE_LABEL[s]).join('・')}）を山札に戻した`);
    }
  }
}

function useForcedSwap(afterStatus, resumeEndTurn){
  const userIdx = state.turn;
  const opponentIdx = 1-userIdx;
  const opponent = state.players[opponentIdx];
  if(!opponent.main){ log('相手にメインがいないため入れ替えは不発だった。'); return; }
  const hasBench = opponent.bench.some(b=>b!==null);
  if(!hasBench){ log('相手のベンチが空のため入れ替えは不発だった。'); return; }
  if(isAiControlled(opponentIdx)){
    let bestIdx=-1, bestHp=-1;
    opponent.bench.forEach((b,i)=>{ if(b && b.hp>bestHp){ bestHp=b.hp; bestIdx=i; } });
    const tmp = opponent.main;
    opponent.main = opponent.bench[bestIdx];
    opponent.bench[bestIdx] = tmp;
    clearStatusOnBenched(tmp);
    log(`${lname(opponent.name)}のメインとベンチが入れ替わった！（${lname(opponent.main.card.name)}がメインに）`);
    if(afterStatus && opponent.main && opponent.main.hp > 0){
      applyStatus(opponent.main, afterStatus, userIdx);
    }
  } else {
    state.forcedSwapPending = { playerIdx: opponentIdx, afterStatus: afterStatus||null, afterStatusSource: userIdx, resumeEndTurn: !!resumeEndTurn };
    log(`${lname(opponent.name)}はメインと入れ替えるベンチのキャラを選んでください。`);
  }
}

function resolveForcedSwap(benchIndex){
  if(!state.forcedSwapPending) return;
  const pending = state.forcedSwapPending;
  const player = state.players[pending.playerIdx];
  if(!player.bench[benchIndex]) return;
  const tmp = player.main;
  player.main = player.bench[benchIndex];
  player.bench[benchIndex] = tmp;
  clearStatusOnBenched(tmp);
  log(`${lname(player.main.card.name)}とメインが入れ替わった！`);
  if(pending.afterStatus && player.main && player.main.hp > 0){
    applyStatus(player.main, pending.afterStatus, pending.afterStatusSource);
  }
  const shouldEndTurn = pending.resumeEndTurn;
  state.forcedSwapPending = null;
  if(shouldEndTurn){ endTurn(); } else { render(); }
}

function onTargetClick(targetKey){
  if(state.selectedHandIndex === null) return;
  const player = state.players[state.turn];
  const idx = state.selectedHandIndex;
  const card = player.hand[idx];
  if(!card){ state.selectedHandIndex = null; return; }
  const instance = targetKey === 'main' ? player.main : player.bench[parseInt(targetKey.slice(5),10)];
  if(!instance){ log('そこにはキャラクターがいません。'); render(); return; }

  if(card.isEnergy){
    instance.energy++;
    state.energyAttachedThisTurn++;
    log(`${lname(instance.card.name)}に霊力エネルギーを1枚つけた（このターン${state.energyAttachedThisTurn}/2枚、現在${instance.energy}枚）。`);
  } else if(card.isRetreatEnergy){
    instance.retreatEnergy = (instance.retreatEnergy||0) + 1;
    log(`${lname(instance.card.name)}に交代エネルギーを1枚つけた（現在${instance.retreatEnergy}枚）。`);
  } else if(card.isItem){
    if(instance.item){
      player.discard.push(instance.item);
      log(`${lname(instance.item.name)}を外した。`);
    }
    instance.item = card;
    if(card.effect.hp){
      instance.maxHpBonus = (instance.maxHpBonus||0) + card.effect.hp;
      instance.hp += card.effect.hp;
    }
    state.itemAttachedThisTurn = true;
    log(`${lname(instance.card.name)}に「${card.name}」を持たせた！（${card.desc}）`);
  } else if(card.isSpecial || card.isSupport){
    const useLabel = `「${card.name}」を使用`;
    if(card.effectType === 'healAny'){
      healInstance(instance, card.amount);
      log(`${useLabel} → ${lname(instance.card.name)}のHPを${lheal(card.amount)}`);
    } else if(card.effectType === 'energyPlus'){
      instance.energy += card.amount;
      log(`${useLabel} → ${lname(instance.card.name)}にエネルギー${card.amount}個追加`);
    } else if(card.effectType === 'cureStatus'){
      if(instance.status){
        const statusLabel = instance.status.type==='burn'?'やけど':instance.status.type==='freeze'?'凍結':instance.status.type==='regen'?'再生':instance.status.type==='curse'?'道連れの呪い':'結界';
        log(`${useLabel} → ${lname(instance.card.name)}の${statusLabel}を解除`);
        instance.status = null;
      } else {
        log(`${useLabel} → ${lname(instance.card.name)}には状態異常がなく不発`);
      }
    }
    if(card.isSpecial) state.specialUsedThisTurn = true;
  }
  player.hand.splice(idx,1);
  state.selectedHandIndex = null;
  render();
}

function onEnemyTargetClick(targetKey){
  if(state.selectedHandIndex === null) return;
  const player = state.players[state.turn];
  const opponent = state.players[1-state.turn];
  const idx = state.selectedHandIndex;
  const card = player.hand[idx];
  if(!card || card.effectType !== 'energyMinus') return;
  const instance = targetKey === 'main' ? opponent.main : opponent.bench[parseInt(targetKey.slice(5),10)];
  if(!instance){ log('そこにはキャラクターがいません。'); render(); return; }
  const before = instance.energy;
  instance.energy = Math.max(0, instance.energy-1);
  log(`「${card.name}」を使用 → ${lname(instance.card.name)}のエネルギーを1個減少（${before}→${instance.energy}）`);
  state.specialUsedThisTurn = true;
  player.hand.splice(idx,1);
  state.selectedHandIndex = null;
  render();
}

function clearStatusOnBenched(instance){
  if(instance && instance.status){
    log(`${lname(instance.card.name)}はベンチに戻り、状態異常が解除された。`);
    instance.status = null;
  }
}

function retreatSwap(benchIndex){
  if(state.gameOver) return;
  if(state.retreatUsedThisTurn){ log('このターンはすでに入れ替えを行いました。'); render(); return; }
  const player = state.players[state.turn];
  if((player.retreatLockedTurns||0) > 0){ log('交代を封じられていて入れ替えができない！'); render(); return; }
  if(!player.bench[benchIndex]) return;
  if(player.main){
    if(!player.main.retreatEnergy || player.main.retreatEnergy <= 0){
      log('メインに交代エネルギーがついていないため入れ替えができない。');
      render();
      return;
    }
    player.main.retreatEnergy--;
    const tmp = player.main;
    player.main = player.bench[benchIndex];
    player.bench[benchIndex] = tmp;
    clearStatusOnBenched(tmp);
    log(`${player.main.card.name}とメインを交代した！`);
  } else {
    player.main = player.bench[benchIndex];
    player.bench[benchIndex] = null;
    log(`${player.main.card.name}をメインに繰り上げた！`);
  }
  state.retreatUsedThisTurn = true;
  render();
}

function calcWeaknessBonus(weaknessArr, attackerTags){
  const tagSet = new Set(attackerTags);
  let matches = 0;
  (weaknessArr||[]).forEach(w=>{ if(tagSet.has(w)) matches++; });
  return Math.min(matches, 2) * 30; // 弱点1個:+30、2個:+60
}

function healInstance(instance, amount){
  const maxHp = getMaxHp(instance);
  instance.hp = Math.min(maxHp, instance.hp + amount);
}
